<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#030a16"><title>Squirrel Studios Genesis</title><style>
:root{color-scheme:dark;--blue:#168aff;--ink:#050c17;--edge:#25465f;--muted:#92abc4}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -30%,#12375c,#030913 65%);color:#e9f5ff;font:13px system-ui,-apple-system,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #5abaff;outline-offset:2px}.app{max-width:800px;margin:auto;min-height:100dvh;padding-bottom:85px}.header{display:flex;align-items:center;gap:10px;padding:15px 14px 12px;background:linear-gradient(#0e2035,#050c17);border-bottom:1px solid #2e638b;box-shadow:0 6px 25px #0008}.logo{width:43px;height:43px;display:grid;place-items:center;border:1px solid #b18a48;border-radius:13px;background:radial-gradient(#62451e,#120e0b);font-size:28px;box-shadow:0 0 15px #d99b3840}.brand{flex:1;min-width:0}.brand b{display:block;font-size:21px;letter-spacing:2px;background:linear-gradient(white,#64baff);color:transparent;background-clip:text}.brand small{font-size:9px;letter-spacing:2px;color:#80baff}.headbtn{border:1px solid #244e71;border-radius:10px;background:#101f34;padding:9px;font-size:17px}.status{font-size:10px;color:#76b7f1;margin:11px 14px;display:flex;justify-content:space-between}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#33f4b2;box-shadow:0 0 10px #33f4b2;margin-right:5px}.hero{height:220px;margin:0 12px 14px;position:relative;overflow:hidden;border:1px solid #3478a9;border-radius:17px;background:radial-gradient(ellipse at 70% 30%,#255585 0,#11233b 38%,#080e1b 80%);box-shadow:0 0 22px #0068b022,inset 0 0 40px #0009}.hero:before{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#02060bd9,transparent 70%),repeating-linear-gradient(90deg,transparent 0 25px,#4ba8ff13 26px 27px,transparent 28px 40px);transform:perspective(300px) rotateX(4deg)}.skyline{position:absolute;bottom:0;left:0;right:0;height:55%;background:linear-gradient(90deg,#050e19 3%,transparent 3% 5%,#071827 5% 11%,transparent 11% 13%,#0b2138 13% 18%,transparent 18% 20%,#081522 20% 26%,transparent 26% 28%,#0a1a29 28% 33%,transparent 33% 35%,#0a1928 35% 41%,transparent 41% 43%,#0a1b2a 43% 48%,transparent 48% 51%,#091626 51% 57%,transparent 57% 59%,#081625 59% 66%,transparent 66% 69%,#0a1a2d 69% 75%,transparent 75% 78%,#071725 78% 83%,transparent 83% 86%,#0a1d2e 86% 93%,transparent 93% 95%,#081421 95%);opacity:.75}.hero-copy{position:absolute;bottom:19px;left:20px;right:20px}.hero-copy .eyebrow{font-size:10px;letter-spacing:3px;color:#83d1ff}.hero-copy h1{font-size:27px;letter-spacing:2px;margin:5px 0;text-shadow:0 3px 9px #000}.hero-copy p{font-size:11px;color:#c3d9ee;margin:0;max-width:260px}.sectiontitle{display:flex;align-items:center;justify-content:space-between;margin:17px 15px 10px}.sectiontitle b{font-size:12px;letter-spacing:1.5px}.sectiontitle small{color:#77a4c8;font-size:9px}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 12px}.tile{min-height:92px;border:1px solid var(--c);border-radius:12px;text-align:left;padding:13px;background:radial-gradient(ellipse at 0 0,color-mix(in srgb,var(--c) 32%,transparent),transparent 85%),linear-gradient(135deg,#13243c,#070f1c);box-shadow:inset 0 1px #ffffff21,0 6px 16px #0007;position:relative}.tile:before{content:'';position:absolute;top:0;left:12px;right:12px;height:2px;background:linear-gradient(90deg,transparent,var(--c),transparent)}.tile .ico{display:inline-grid;place-items:center;width:34px;height:34px;border:1px solid var(--c);border-radius:9px;background:#0005;color:var(--c);font-size:19px;margin-bottom:9px}.tile b{display:block;font-size:14px;letter-spacing:1px}.tile small{display:block;color:#a9bfd3;font-size:10px;margin-top:3px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:0 12px}.summary>div{border:1px solid #294f72;background:linear-gradient(#10233b,#070f1b);border-radius:11px;text-align:center;padding:13px 5px}.summary strong{display:block;color:#5ab9ff;font-size:22px}.summary small{font-size:9px;color:#91abc1}.bottom{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;gap:2px;padding:8px 4px max(9px,env(safe-area-inset-bottom));background:#050d1bf5;border-top:1px solid #2c587a;z-index:10}.bottom button{background:none;border:0;min-width:50px;padding:7px 4px;border-radius:9px;font-size:10px;color:#91a8bf}.bottom button span{display:block;font-size:21px;margin-bottom:4px}.bottom button.active{color:#5bbaff;background:#112742}.page{padding:0 12px 20px}.page h2{font-size:24px;letter-spacing:2px;margin:18px 0 3px}.page .sub{color:#91abc1;margin:0 0 15px;font-size:11px}.tabs{display:flex;gap:6px;overflow:auto;margin:10px 0 14px;padding-bottom:3px}.tabs button{border:1px solid #244e72;border-radius:9px;background:#0b1a2d;padding:9px 13px;white-space:nowrap;font-size:11px}.tabs button.active{background:#184779;border-color:#2d9cff}.panel{border:1px solid #254d6e;border-radius:13px;padding:14px;margin:10px 0;background:linear-gradient(135deg,#11233a,#070f1b)}.panel h3{font-size:13px;margin:0 0 10px;letter-spacing:1px}.field{width:100%;border:1px solid #315979;background:#071424;border-radius:9px;color:white;min-height:43px;padding:11px;margin:5px 0}.action{border:1px solid #329aff;border-radius:9px;background:linear-gradient(#1878e7,#0c3979);padding:10px 14px;font-weight:750;margin:5px 4px 5px 0}.secondary{background:#0c2037;border:1px solid #315d81;border-radius:8px;padding:8px 10px;margin:3px;font-size:11px}.rowitem{display:flex;align-items:center;gap:9px;border-bottom:1px solid #23405c;padding:11px 0}.rowitem:last-child{border:0}.rowitem .content{flex:1;min-width:0;overflow-wrap:anywhere}.rowitem b{font-size:12px}.rowitem small{display:block;color:#8aa7c2;margin-top:4px}.empty{color:#87a1b9;font-size:12px;line-height:1.6}.tag{font-size:9px;letter-spacing:1px;color:#79c2ff;border:1px solid #245d86;border-radius:20px;padding:5px 9px}.editor{font:12px/1.7 monospace;min-height:290px;resize:vertical;tab-size:2;white-space:pre}.console{font:11px/1.7 monospace;background:#030a11;border:1px solid #1e435a;border-radius:9px;padding:11px;color:#8cdeb0;min-height:70px;white-space:pre-wrap}.forgepreview{height:200px;border:1px solid #465c72;border-radius:10px;background:linear-gradient(#162337,#080d16);display:grid;place-items:center;position:relative;overflow:hidden}.forgepreview:before{content:'';position:absolute;inset:0;background:linear-gradient(transparent 95%,#487ab32b 96%),linear-gradient(90deg,transparent 95%,#487ab32b 96%);background-size:25px 25px;transform:perspective(190px) rotateX(25deg) scale(1.4)}.forgepreview .mesh{font-size:76px;filter:drop-shadow(0 0 17px #e49c3955);z-index:1}.meter{display:flex;gap:8px;margin:12px 0}.meter>div{flex:1;border:1px solid #285475;border-radius:10px;text-align:center;padding:13px 3px}.meter b{display:block;font-size:18px;color:#5fe2b8}.meter small{color:#92abc1;font-size:9px}.warn{color:#ffb86e}.hidden{display:none!important}.pill{color:#77caff;font-size:10px}.settingsrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid #24425d}.settingsrow:last-child{border:0}.settingsrow small{display:block;color:#91abc1;margin-top:4px}.nexus{min-height:210px;background:radial-gradient(ellipse at 85% 25%,#174b6b,#071526 68%);border-color:#145b67}.nexusorb{width:105px;height:105px;border:2px solid #30e6d1;border-radius:50%;margin:15px auto;background:radial-gradient(circle,#238e9d,#0b2842 65%,#030a15);box-shadow:0 0 30px #1ad5d455;display:grid;place-items:center;font-size:42px}.toast{position:fixed;bottom:80px;left:10%;right:10%;padding:11px;border:1px solid #379cce;background:#102d4a;border-radius:10px;z-index:20;text-align:center}.footerhint{text-align:center;font-size:10px;color:#7898b4;padding:17px}@media(min-width:700px){.hero{height:300px}.tiles{grid-template-columns:repeat(3,1fr)}.hero-copy h1{font-size:35px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important}}
</style></head><body><div class="app"><header class="header"><div class="logo" aria-label="Squirrel Studios">🐿</div><div class="brand"><b>GENESIS</b><small>SQUIRREL STUDIOS</small></div><button class="headbtn" onclick="openPage('settings')" aria-label="Settings">⚙</button><button class="headbtn" onclick="openPage('diagnostics')" aria-label="Diagnostics">◉</button></header><div class="status"><span><i class="dot"></i> LOCAL WORKSTATION</span><span>GENESIS / v0.8</span></div><main id="screen"></main><nav class="bottom" id="nav"><button data-nav="home" onclick="openPage('home')"><span>⌂</span>Home</button><button data-nav="operations" onclick="openPage('operations')"><span>▣</span>Projects</button><button data-nav="codex" onclick="openPage('codex')"><span>⌘</span>Code</button><button data-nav="tools" onclick="openPage('tools')"><span>⚒</span>Tools</button><button data-nav="settings" onclick="openPage('settings')"><span>⚙</span>Settings</button></nav><div id="toast" class="toast hidden"></div></div><script>
const oldKey=k=>'genesis.v2.'+k;const key=k=>'genesis.v3.'+k;let page='home',tab='Projects',currentFile='main.lua';const colors={operations:'#288fff',forge:'#ffa32d',codex:'#b65aff',nexus:'#17d9bd',build:'#ff465d',market:'#ffcf54',tools:'#31b8ff',diagnostics:'#28dcb5',settings:'#60aeff'};const icons={operations:'⬡',forge:'⬡',codex:'⌘',nexus:'✧',build:'⬢',market:'◆',tools:'⚒',diagnostics:'✿',settings:'⚙'};
function read(k){try{const x=JSON.parse(localStorage.getItem(key(k))||localStorage.getItem(oldKey(k))||'[]');return Array.isArray(x)?x:[]}catch(e){return []}}function write(k,x){localStorage.setItem(key(k),JSON.stringify(x))}function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function notify(t){const e=document.getElementById('toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2300)}function card(name,sub){return '<button class="tile" style="--c:'+colors[name]+'" onclick="openPage(\''+name+'\')"><span class="ico">'+icons[name]+'</span><b>'+name.toUpperCase()+'</b><small>'+sub+'</small></button>'}
function openPage(p){page=p;tab=p==='operations'?'Projects':p==='forge'?'Models':p==='build'?'Android':p==='market'?'Assets':'Overview';document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.nav===p));render();scrollTo(0,0)}function heading(t,sub){return '<div class="page"><h2>'+t+'</h2><p class="sub">'+sub+'</p>'}function tabs(items){return '<div class="tabs">'+items.map(x=>'<button class="'+(tab===x?'active':'')+'" onclick="switchTab(\''+x+'\')">'+x+'</button>').join('')+'</div>'}function switchTab(x){tab=x;render()}
function render(){let h='';if(page==='home'){const p=read('projects'),t=read('tasks');h='<div class="hero"><div class="skyline"></div><div class="hero-copy"><span class="eyebrow">SQUIRREL STUDIOS / WORKSTATION</span><h1>BIG GAMES<br>START SMALL.</h1><p>Design · Create · Code · Build · Test · Deploy</p></div></div><div class="sectiontitle"><b>STUDIO MODULES</b><small>SELECT WORKSPACE</small></div><div class="tiles">'+card('operations','Project manager')+card('forge','Asset creation')+card('codex','Code editor')+card('nexus','AI assistant')+card('build','Compile & deploy')+card('market','Local asset library')+'</div><div class="sectiontitle"><b>WORKSPACE OVERVIEW</b><small>ON-DEVICE DATA</small></div><div class="summary"><div><strong>'+p.length+'</strong><small>PROJECTS</small></div><div><strong>'+t.filter(x=>!x.done).length+'</strong><small>OPEN TASKS</small></div><div><strong>'+read('notes').length+'</strong><small>NOTES</small></div></div><div class="footerhint">SQUIRREL STUDIOS · YOUR STUDIO, ANYWHERE.</div>'}
else if(page==='operations'){const names=['Projects','Tasks','Assets','Builds','Notes'];h=heading('OPERATIONS','Project manager · local workspace')+tabs(names);const map={Projects:'projects',Tasks:'tasks',Assets:'assets',Builds:'builds',Notes:'notes'},k=map[tab];h+='<div class="panel"><h3>ADD '+tab.toUpperCase()+'</h3><input id="entry" class="field" maxlength="300" placeholder="'+(tab==='Tasks'?'Task description':'Name or description')+'"><button class="action" onclick="addEntry(\''+k+'\')">+ Add '+tab.slice(0,-1)+'</button></div><div class="panel"><h3>'+tab.toUpperCase()+' · '+read(k).length+'</h3>'+rows(k)+'</div></div>'}
else if(page==='forge'){h=heading('FORGE','Asset creation · local catalog')+tabs(['Models','Textures','Animations','Audio']);h+='<div class="forgepreview"><span class="mesh">'+({Models:'⬡',Textures:'▦',Animations:'♙',Audio:'♫'}[tab])+'</span></div><div class="panel"><h3>'+tab.toUpperCase()+' LIBRARY</h3><input id="entry" class="field" maxlength="200" placeholder="Asset name"><button class="action" onclick="addEntry(\'forge_'+tab+'\')">+ Register asset</button><p class="empty">Local asset inventory only. 3D editing, import, rigging and export require a native engine integration.</p>'+rows('forge_'+tab)+'</div></div>'}
else if(page==='codex'){let files=read('codefiles');if(!files.length){files=[{id:'default',text:'main.lua',code:'-- Squirrel Studios Genesis\n-- Your local code workspace\n\nfunction init()\n  print("Genesis ready")\nend\n'}];write('codefiles',files)}if(!files.some(x=>x.text===currentFile))currentFile=files[0].text;const file=files.find(x=>x.text===currentFile);h=heading('CODEX','Local code editor · manual save')+'<div class="panel"><div class="tabs">'+files.map(x=>'<button class="'+(x.text===currentFile?'active':'')+'" onclick="selectFile(\''+esc(x.id)+'\')">'+esc(x.text)+'</button>').join('')+'</div><textarea class="field editor" id="code" spellcheck="false" autocapitalize="off">'+esc(file.code||'')+'</textarea><button class="action" onclick="saveCode()">Save file</button><button class="secondary" onclick="newFile()">+ New file</button><button class="secondary" onclick="copyCode()">Copy source</button><button class="secondary" onclick="deleteFile()">Delete file</button><p class="empty">Edits are saved on this device. No compiler or remote execution is connected.</p></div></div>'}
else if(page==='nexus'){h=heading('NEXUS','AI assistant · connection pending')+'<div class="panel nexus"><div class="nexusorb">✧</div><h3 style="text-align:center;color:#6df6e4">NEXUS INTELLIGENCE</h3><p class="empty" style="text-align:center">NEXUS is not connected to an AI service. Local prompts can be saved as a planning queue; no AI response will be fabricated.</p></div><div class="panel"><textarea id="entry" class="field" rows="3" placeholder="Describe an idea or engineering task"></textarea><button class="action" onclick="addEntry(\'nexusqueue\')">Save to queue</button>'+rows('nexusqueue')+'</div></div>'}
else if(page==='build'){h=heading('BUILD','Compile & deploy · release workspace')+tabs(['Android','PC','Console','Mod Package']);h+='<div class="panel"><h3>'+tab.toUpperCase()+' RELEASE PLANNING</h3><p class="empty">This app cannot compile an APK on-device. The GitHub build pipeline is external; use this page to track release requests without pretending to compile.</p><input class="field" id="entry" placeholder="Release name / version"><button class="action" onclick="addEntry(\'release_'+tab+'\')">+ Add release request</button>'+rows('release_'+tab)+'</div></div>'}
else if(page==='market'){h=heading('MARKET','Personal asset catalog · no online store')+tabs(['Assets','Mods','Tools','Collections']);h+='<div class="panel"><h3>LOCAL '+tab.toUpperCase()+'</h3><input class="field" id="entry" placeholder="Asset or collection name"><button class="action" onclick="addEntry(\'market_'+tab+'\')">+ Add to library</button>'+rows('market_'+tab)+'</div></div>'}
else if(page==='tools'){h=heading('TOOLS','Utility suite')+'<div class="tiles">'+[['File Manager','Native file access not connected'],['Image Editor','Planned integration'],['Audio Editor','Planned integration'],['APK Signer','Signed by GitHub workflow'],['Performance','Device telemetry not connected'],['Backup','Export your local data']].map((x,i)=>'<button class="tile" style="--c:#36b7ff" onclick="'+(i===5?'backup()':'notify(\'This tool is not connected yet\')')+'"><span class="ico">'+['▣','▧','♫','♢','◉','⇩'][i]+'</span><b>'+x[0]+'</b><small>'+x[1]+'</small></button>').join('')+'</div><div id="backupPanel"></div></div>'}
else if(page==='diagnostics'){const counts=['projects','tasks','notes','assets','builds','codefiles'].map(x=>read(x).length);h=heading('DIAGNOSTICS','Local application health · no fake hardware readings')+'<div class="meter"><div><b>'+counts[0]+'</b><small>PROJECTS</small></div><div><b>'+counts[1]+'</b><small>TASKS</small></div><div><b>'+counts[2]+'</b><small>NOTES</small></div></div><div class="panel"><h3>LOCAL DATA STATUS</h3><p class="empty">On-device browser storage: '+(storageWorks()?'Available':'Unavailable')+'</p><p class="empty">CPU / RAM / GPU: Not connected to Android telemetry.</p><p class="empty">Cloud synchronization: Not connected.</p><button class="action" onclick="render()">Refresh local check</button></div></div>'}
else if(page==='settings'){h=heading('SETTINGS','Customize your workstation')+'<div class="panel"><div class="settingsrow"><div><b>Reduced motion</b><small>Disable interface animations</small></div><input type="checkbox" id="motion" '+(localStorage.getItem('genesis.lowMotion')==='true'?'checked':'')+' onchange="setMotion(this.checked)"></div><div class="settingsrow"><div><b>Local data backup</b><small>Copy a JSON backup of your projects and notes</small></div><button class="secondary" onclick="backup()">Export</button></div><div class="settingsrow"><div><b>Version</b><small>Genesis v0.8.0 · redesigned module shell</small></div></div><div class="settingsrow"><div><b>Signing</b><small>Permanent release signing through GitHub</small></div></div></div><div id="backupPanel"></div></div>'}
document.getElementById('screen').innerHTML=h}
function rows(k){const a=read(k);if(!a.length)return '<p class="empty">Nothing saved here yet.</p>';return a.map(x=>'<div class="rowitem">'+(k==='tasks'?'<input type="checkbox" '+(x.done?'checked':'')+' onchange="toggleDone(\''+esc(x.id)+'\')">':'')+'<div class="content"><b style="'+(x.done?'text-decoration:line-through':'')+'">'+esc(x.text)+'</b></div><button class="secondary" onclick="editEntry(\''+k+'\',\''+esc(x.id)+'\')">Edit</button><button class="secondary" onclick="removeEntry(\''+k+'\',\''+esc(x.id)+'\')">×</button></div>').join('')}
function addEntry(k){const e=document.getElementById('entry');const t=e.value.trim();if(!t)return;const a=read(k);a.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2),text:t,done:false});write(k,a);render();notify('Saved locally')}function removeEntry(k,id){if(!confirm('Delete this entry?'))return;write(k,read(k).filter(x=>x.id!==id));render()}function editEntry(k,id){const a=read(k),x=a.find(x=>x.id===id);if(!x)return;const t=prompt('Edit',x.text);if(t===null||!t.trim())return;x.text=t.trim();write(k,a);render()}function toggleDone(id){const a=read('tasks'),x=a.find(x=>x.id===id);if(x){x.done=!x.done;write('tasks',a);render()}}
function selectFile(id){const x=read('codefiles').find(x=>x.id===id);if(x){if(document.getElementById('code')&&!confirm('Switch file? Save current edits first.'))return;currentFile=x.text;render()}}function saveCode(){const a=read('codefiles'),x=a.find(x=>x.text===currentFile);if(x){x.code=document.getElementById('code').value;write('codefiles',a);notify('Code saved locally')}}function newFile(){const name=prompt('Filename (example: script.lua)');if(!name||!name.trim())return;const a=read('codefiles');if(a.some(x=>x.text===name.trim())){notify('Filename already exists');return}a.push({id:Date.now().toString(36),text:name.trim(),code:''});write('codefiles',a);currentFile=name.trim();render()}function deleteFile(){if(!confirm('Delete this code file?'))return;const a=read('codefiles').filter(x=>x.text!==currentFile);write('codefiles',a);currentFile=a.length?a[0].text:'main.lua';render()}function copyCode(){const e=document.getElementById('code');e.select();document.execCommand('copy');notify('Source selected / copy requested')}
function backup(){const o={version:3,exportedAt:new Date().toISOString(),data:{}};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('genesis.v2.')||k.startsWith('genesis.v3.'))o.data[k]=localStorage.getItem(k)}const e=document.getElementById('backupPanel');e.innerHTML='<div class="panel"><h3>LOCAL BACKUP</h3><textarea class="field" id="backupText" rows="7" readonly></textarea><button class="secondary" onclick="selectBackup()">Select all</button></div>';document.getElementById('backupText').value=JSON.stringify(o,null,2);notify('Backup prepared — copy and store safely')}function selectBackup(){const e=document.getElementById('backupText');e.select();document.execCommand('copy')}function storageWorks(){try{localStorage.setItem('genesis.healthcheck','1');localStorage.removeItem('genesis.healthcheck');return true}catch(e){return false}}function setMotion(x){localStorage.setItem('genesis.lowMotion',String(x));document.body.style.setProperty('scroll-behavior',x?'auto':'smooth')}openPage('home');
</script></body></html>
