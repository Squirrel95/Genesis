function get(k,fallback){try{const x=JSON.parse(localStorage.getItem(K+k));return x===null?fallback:x}catch{return fallback}}
function put(k,value){try{localStorage.setItem(K+k,JSON.stringify(value));return true}catch{toast('Local storage is full or unavailable');return false}}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]))}
function attr(v){return escapeHtml(v)}
function uid(){return String(Date.now())+Math.random().toString(36).slice(2,8)}
function oldItems(k){const now=get(k,null);if(Array.isArray(now))return now;let entries=[];for(const p of ['genesis.v3.','genesis.v2.']){try{const a=JSON.parse(localStorage.getItem(p+k)||'[]');if(Array.isArray(a))entries.push(...a)}catch{}}const seen=new Set();const result=entries.filter(x=>{const id=String(x.id||x.text||'');if(!id||seen.has(id))return false;seen.add(id);return true}).map(x=>({id:String(x.id||uid()),text:String(x.text||'').slice(0,1000),done:!!x.done,project:String(x.project||'')}));put(k,result);return result}

y in the device's IndexedDB. A JSON backup includes the records and settings, not custom image files.</p><div class="page-actions"><button class="metal" data-action="export">EXPORT JSON BACKUP</button><button class="metal" data-action="import">IMPORT JSON BACKUP</button><button class="metal" data-action="copy">COPY BACKUP TEXT</button></div><textarea id="backupArea" class="search" style="min-height:110px" placeholder="Backup JSON appears here; you can also paste a saved backup" aria-label="Backup JSON"></textarea></section>`}
function render(){renderNav();let s;switch(state.page){case 'home':s=renderHome();break;case 'games':s=renderGames();break;case 'game':s=renderDetails();break;case 'ark':s=renderArk();break;case 'projects':case 'tasks':case 'notes':s=collectionPage(state.noteKind);break;case 'forge':s=renderForge();break;case 'printing':s=renderPrinting();break;case 'routes':s=renderRoutes();break;case 'settings':s=renderSettings();break;default:s=renderHome();} $('view').innerHTML=s;refreshStatus();}
function applyRgb(){const r=state.rgb;const root=document.documentElement;const brightness=r.enabled?r.brightness:0;root.style.setProperty('--rgb-strength',String(brightness/100));root.style.setProperty('--accent',r.mode==='static'?r.hex:'#6dff36');root.style.setProperty('--rgb-cycle', (16 - r.speed*0.14).toFixed(1)+'s');document.body.dataset.rgb=r.mode;document.body.classList.toggle('no-rgb',!r.enabled);document.body.classList.toggle('unsynced',!r.sync);document.body.classList.toggle('reduce-motion',state.lowMotion);}
function saveRgb(){const r=state.rgb;r.mode=$('rgbFur')?.checked?'hyperfur':r.mode;r.enabled=!!$('rgbEnabled')?.checked;r.sync=!!$('rgbSync')?.checked;r.brightness=Number($('brightness')?.value)||85;r.speed=Number($('speed')?.value)||70;r.hex=$('rgbHex')?.value||'#63ff34';state.lowMotion=!!$('reduceMotion')?.checked;put('reduceMotion',state.lowMotion);put('rgb',r);applyRgb();toast('Lighting settings saved');render();}
function toggle(list,id){const s=new Set(get(list,[]));s.has(id)?s.delete(id):s.add(id);put(list,Array.from(s));render()}
function slide(gid,delta){const g=GAMES.find(g=>g.id===gid);if(!g)return;const n=validIndexes(g);if(n.length<2){toast('Add two more images for this game to enable rotation');return}const current=n.indexOf(state.imageIndex[gid]??0);state.imageIndex[gid]=n[(current+delta+n.length)%n.length];const card=document.querySelector(`[data-game="${gid}"]`);if(card){const i=state.imageIndex[gid];card.querySelector('img').src=gameImage(g,i);card.querySelectorAll('.dots span').forEach((e,idx)=>e.classList.toggle('on',idx===i))}}
function refreshStatus(){const node=$('refreshView');if(node)node.textContent=new Intl.DateTimeFormat(undefined,{hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(new Date())}
let intervalCounter=0;setInterval(()=>{intervalCounter++;if(intervalCounter%2===0&&state.page==='games') {const g=GAMES[(intervalCounter/2-1)%GAMES.length];const n=validIndexes(g);if(n.length>1){const current=n.indexOf(state.imageIndex[g.id]??0);const opts=n.filter((_,idx)=>idx!==current);state.imageIndex[g.id]=opts[Math.floor(Math.random()*opts.length)];const el=document.querySelector(`[data-game=\"${g.id}\"]`);if(el){el.querySelector('img').src=gameImage(g,state.imageIndex[g.id]);el.querySelectorAll('.dots span').forEach((d,i)=>d.classList.toggle('on',i===state.imageIndex[g.id]))}}} // sequential stagger: UI-only status, never a fabricated game connection
if(intervalCounter%1===0)refreshStatus();},1000);
let frameCount=0,frameStart=performance.now();function frame(now){frameCount++;if(now-frameStart>=1200){const fps=Math.min(240,Math.round(frameCount*1000/(now-frameStart)));const el=$('fpsValue');if(el)el.textContent=fps+' FPS';frameStart=now;frameCount=0}requestAnimationFrame(frame)}requestAnimationFrame(frame);
function openDatabase(){return new Promise((resolve,reject)=>{if(!window.indexedDB)return reject(Error('IndexedDB unavailable'));const request=indexedDB.open('squirrel-genesis-artwork',1);request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains('images'))request.result.createObjectStore('images')};request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)})}
async function loadAllArt(){try{state.artDb=await openDatabase();const tx=state.artDb.transaction('images','readonly');const st=tx.objectStore('images');const keys=await new Promise((resolve,reject)=>{const req=st.getAllKeys();req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});for(const k of keys){const blob=await new Promise((resolve,reject)=>{const req=st.get(k);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});if(blob?.type?.startsWith('image/')){const [gid,slot]=String(k).split(':');(state.imageSlots[gid]??={})[Number(slot)]=URL.createObjectURL(blob)}}render()}catch(err){console.warn('Artwork database unavailable',err)}}
async function uploadImages(gid,files){const g=GAMES.find(x=>x.id===gid);if(!g||!files.length)return;let used=0;for(const file of files.slice(0,3)){if(!file.type.startsWith('image/'))continue;if(file.size>9*1024*1024){toast('Image larger than 9 MB; skip it');continue}const slot=files.length>=3?used:used+1;used++;try{if(!state.artDb)state.artDb=await openDatabase();await new Promise((resolve,reject)=>{const t=state.artDb.transaction('images','readwrite');const req=t.objectStore('images').put(file,`${gid}:${slot}`);req.onsuccess=resolve;req.onerror=()=>reject(req.error)});if(state.imageSlots[gid]?.[slot])URL.revokeObjectURL(state.imageSlots[gid][slot]);(state.imageSlots[gid]??={})[slot]=URL.createObjectURL(file)}catch(e){toast('Artwork storage unavailable');console.error(e)}}render();toast(`${used} image(s) saved offline`)}
function exportJson(){const names=['projects','tasks','notes','favorites','installed','gameNotes','arkEntries','assets','printer','routes','rgb','reduceMotion'];const data={format:'Squirrel Studios Genesis local data',version:4,exportedAt:new Date().toISOString(),data:{}};for(const n of names)data.data[n]=get(n,Array.isArray(get(n,null))?[]:{});return JSON.stringify(data,null,2)}
function importJson(text){let data;try{data=JSON.parse(text)}catch{toast('Invalid JSON file');return}if(data.format!=='Squirrel Studios Genesis local data'||!data.data||data.version!==4){toast('This is not a compatible Genesis v4 backup');return}const names=['projects','tasks','notes','favorites','installed','gameNotes','arkEntries','assets','printer','routes','rgb','reduceMotion'];for(const n of names){if(Object.prototype.hasOwnProperty.call(data.data,n))put(n,data.data[n])}state.rgb=get('rgb',state.rgb);state.lowMotion=get('reduceMotion',false);applyRgb();render();toast('Backup data restored')}
function handleAction(button){const a=button.dataset.action,id=button.dataset.id||'';switch(a){case 'favorite':toggle('favorites',id);break;case 'installed':toggle('installed',id);break;case 'slide':slide(id,Number(button.dataset.dir)||1);break;case 'details':state.page='game';state.game=id;state.currentSection='';render();break;case 'upload':state.game=id;$('artInput').value='';$('artInput').click();break;case 'section':state.page='game';state.game=id;state.currentSection=button.dataset.section;render();break;case 'saveGameNote':{const notes=get('gameNotes',{});notes[id]=$('gameNote').value;put('gameNotes',notes);toast('Game note saved');break}case 'list':state.noteKind=button.dataset.kind;state.page='projects';render();break;case 'addItem':{const kind=button.dataset.kind;const text=$('newEntry')?.value?.trim();if(!text){toast('Enter a name or note first');break}const items=oldItems(kind);items.unshift({id:uid(),text,done:false,project:kind==='tasks'?$('taskProject').value:''});put(kind,items);render();toast('Saved offline');break}case 'deleteItem':{if(!confirm('Delete this item?'))break;const kind=button.dataset.kind;put(kind,oldItems(kind).filter(x=>x.id!==id));render();break}case 'addArk':{const title=$('arkTitle').value.trim(),content=$('arkContent').value.trim(),category=$('arkTag').value.trim()||'Personal';if(!title||!content){toast('Both title and note are required');break}const rows=get('arkEntries',[]);rows.unshift({title,info:content,category,source:'User-authored note'});put('arkEntries',rows);render();toast('ARK note saved offline');break}case 'addForge':{const name=$('forgeName').value.trim();if(!name){toast('Enter an asset name');break}put('assets',[{id:uid(),name,target:$('forgeTarget').value,notes:$('forgeNotes').value},...get('assets',[])]);render();toast('Asset record saved');break}case 'removeAsset':if(confirm('Delete this asset record?')){put('assets',get('assets',[]).filter(x=>x.id!==id));render()}break;case 'savePrinter':{const p={name:$('printerName').value.trim()||'Printer',bedX:Number($('bedX').value),bedY:Number($('bedY').value),bedZ:Number($('bedZ').value),material:$('material').value};if([p.bedX,p.bedY,p.bedZ].some(n=>!Number.isFinite(n)||n<1||n>2000)){toast('Enter valid build dimensions');break}put('printer',p);toast('Printer saved');render();break}case 'checkFit':{const p=get('printer',{bedX:220,bedY:220,bedZ:250});const dims=['modelX','modelY','modelZ'].map(k=>Number($(k).value));if(dims.some(n=>!Number.isFinite(n)||n<=0)){toast('Enter all three model dimensions');break}const fits=(dims[0]<=p.bedX&&dims[1]<=p.bedY||dims[1]<=p.bedX&&dims[0]<=p.bedY)&&dims[2]<=p.bedZ;$('fitResult').textContent=fits?'Within stated bed limits (before margins/supports).':'Does not fit the stated bed dimensions in this orientation.';break}case 'addRoute':{const name=$('routeName').value.trim(),stops=$('routeStops').value.trim();if(!name||!stops){toast('Enter a name and stops');break}put('routes',[{id:uid(),name,stops},...get('routes',[])]);render();toast('Route saved offline');break}case 'deleteRoute':if(confirm('Delete this route?')){put('routes',get('routes',[]).filter(x=>x.id!==id));render()}break;case 'rgb':state.rgb.mode=button.dataset.mode;put('rgb',state.rgb);applyRgb();render();break;case 'saveRgb':saveRgb();break;case 'resetRgb':state.rgb={enabled:true,mode:'simple',brightness:85,speed:70,sync:true,hex:'#63ff34'};state.lowMotion=false;put('rgb',state.rgb);put('reduceMotion',false);applyRgb();render();toast('RGB defaults restored');break;case 'export':{const json=exportJson();$('backupArea').value=json;try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download='Genesis-backup.json';document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}catch{}toast('Backup text generated');break}case 'copy':{const a=$('backupArea');if(!a.value)a.value=exportJson();a.select();try{navigator.clipboard?.writeText(a.value).then(()=>toast('Backup copied'),()=>toast('Select and copy the backup text'))}catch{toast('Select and copy the text')}break}case 'import':{const content=$('backupArea').value.trim();if(content)importJson(content);else $('importInput').click();break}}}
document.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;if(btn.dataset.go){e.preventDefault();if(btn.dataset.go==='game'&&!state.game)state.game='7d2d';navigate(btn.dataset.go);return}if(btn.dataset.filter){state.gameFilter=btn.dataset.filter;render();return}if(btn.dataset.action){e.preventDefault();handleAction(btn)}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='arkCategory'){state.selectedCategory=el.value;const pos=window.scrollY;render();window.scrollTo(0,pos)}if(el.dataset.action==='completeTask'){const list=oldItems('tasks');const item=list.find(x=>x.id===el.dataset.id);if(item){item.done=el.checked;put('tasks',list);render()}}if(el.id==='rgbFur'){state.rgb.mode=el.checked?'hyperfur':'simple';applyRgb();render()}if(el.id==='rgbEnabled'){state.rgb.enabled=el.checked;applyRgb()}if(el.id==='rgbSync'){state.rgb.sync=el.checked;applyRgb()}if(el.id==='reduceMotion'){state.lowMotion=el.checked;applyRgb()}});
let searchDelay;document.addEventListener('input',e=>{const el=e.target;if(el.id==='gameSearch'){state.query=el.value;clearTimeout(searchDelay);searchDelay=setTimeout(()=>{const focusPos=el.selectionStart;render();const next=$('gameSearch');next?.focus();if(next?.setSelectionRange)next.setSelectionRange(focusPos,focusPos)},120)}else if(el.id==='arkSearch'){state.arkQuery=el.value;clearTimeout(searchDelay);searchDelay=setTimeout(()=>{render();$('arkSearch')?.focus()},180)}else if(el.id==='brightness'){$('brightnessText').textContent=el.value+'%';state.rgb.brightness=Number(el.value);applyRgb()}else if(el.id==='speed'){$('speedText').textContent=el.value+'%';state.rgb.speed=Number(el.value);applyRgb()}else if(el.id==='rgbHex'){state.rgb.hex=el.value;applyRgb()}});
$('artInput').addEventListener('change',e=>{uploadImages(state.game,Array.from(e.target.files||[]))});$('importInput').addEventListener('change',async e=>{const f=e.target.files?.[0];if(f&&f.size<5e6)importJson(await f.text());else toast('Invalid or overly large backup')});
$('openNav').addEventListener('click',()=>{if(window.innerWidth>850){$('app').classList.remove('nav-collapsed')}else{openDrawer()}});$('closeNav').addEventListener('click',()=>{if(window.innerWidth>850){$('app').classList.add('nav-collapsed');closeDrawer()}else closeDrawer()});$('shade').addEventListener('click',closeDrawer);$('settingsBtn').addEventListener('click',()=>navigate('settings'));
let swipeStart=null;document.addEventListener('touchstart',e=>{if(e.touches.length===1)swipeStart={x:e.touches[0].clientX,y:e.touches[0].clientY}}, {passive:true});document.addEventListener('touchend',e=>{if(!swipeStart)return;const dx=e.changedTouches[0].clientX-swipeStart.x,dy=e.changedTouches[0].clientY-swipeStart.y;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.6){if(state.drawerOpen&&dx<0)closeDrawer();else if(!state.drawerOpen&&dx>0&&swipeStart.x<26)openDrawer()}swipeStart=null},{passive:true});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});
const initial=decodeURIComponent((location.hash||'#home').slice(1));state.page=['home','games','ark','projects','forge','printing','routes','settings'].includes(initial)?initial:'home';state.noteKind='projects';applyRgb();oldItems('projects');oldItems('tasks');oldItems('notes');render();loadAllArt();

window.genesisBack=function(){if(state.drawerOpen){closeDrawer();return true}if(state.page!=='home'){navigate('home');return true}return false};
</script></body></html>
