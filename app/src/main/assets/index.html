<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Squirrel Studios Genesis</title><style>
:root{color-scheme:dark;--bg:#030812;--panel:#091525;--edge:#26425e;--ink:#e7f5ff;--muted:#90a8c0;--accent:#3faeff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -10%,#193b5a,#030812 60%);color:var(--ink);font:14px system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #72d9ff}header{padding:20px 16px 14px;border-bottom:1px solid #355572;background:linear-gradient(130deg,#061321,#122b45 55%,#040b15)}.brand{font-weight:900;font-size:clamp(21px,4vw,32px);letter-spacing:1.3px;color:#d8eaff;text-shadow:0 0 16px #329dff6e}.tagline{font-size:10px;letter-spacing:2px;color:#87c6ed;margin-top:4px}.layout{max-width:1400px;margin:auto;padding:15px 14px 100px}.headline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.headline h1{font-size:23px;margin:0}.status{font-size:10px;color:#67efbd}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.launch{position:relative;text-align:left;min-height:110px;border:1px solid color-mix(in srgb,var(--accent) 45%,#19344b);border-radius:16px;padding:16px;background:radial-gradient(ellipse at 80% 0%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 68%),linear-gradient(145deg,#12263d,#070e1b);color:var(--ink);box-shadow:inset 0 1px #ffffff25,0 10px 24px #0007,0 0 18px color-mix(in srgb,var(--accent) 10%,transparent)}.launch b{display:block;font-size:16px;color:var(--accent);letter-spacing:.5px}.launch small{display:block;margin-top:8px;color:var(--muted);line-height:1.4}.launch .symbol{font-size:28px;display:block;margin-bottom:8px;text-shadow:0 0 15px var(--accent)} .launch[data-id=operations]{--accent:#4faeff}.launch[data-id=forge]{--accent:#ffae47}.launch[data-id=codex]{--accent:#df79ff}.launch[data-id=nexus]{--accent:#45e9cb}.launch[data-id=build]{--accent:#ff6179}.launch[data-id=market]{--accent:#ffd257}.launch[data-id=tools]{--accent:#6cb8ff}.launch[data-id=diagnostics]{--accent:#52edb1}.launch[data-id=settings]{--accent:#91b7ff}.panel{border:1px solid #294764;background:linear-gradient(145deg,#0d1b2e,#07111e);border-radius:15px;padding:15px;margin-bottom:13px}.panel h2{font-size:16px;margin:0 0 13px;color:#9cd6ff}.tabs{display:flex;gap:7px;overflow:auto;padding:2px 0 12px}.tabs button,.ghost{background:#11243b;color:#c7e3f8;border:1px solid #355776;border-radius:9px;padding:10px 12px;white-space:nowrap}.tabs button.active{background:#195189;border-color:#4daaff;color:white}.field{display:block;width:100%;border:1px solid #365775;border-radius:10px;background:#06111e;color:white;padding:12px;margin:8px 0;min-height:42px}.primary{background:linear-gradient(120deg,#1168bf,#269ee8);border:1px solid #6ac5ff;color:white;font-weight:750;border-radius:10px;padding:11px 14px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.item{display:flex;align-items:center;gap:9px;padding:12px 0;border-bottom:1px solid #28405b}.item:last-child{border:0}.item .detail{flex:1;min-width:0;overflow-wrap:anywhere}.item small{display:block;color:var(--muted);margin-top:5px}.empty{color:var(--muted);line-height:1.6}.editor{font:13px/1.6 ui-monospace,monospace;min-height:300px;resize:vertical;tab-size:2}.footnav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#061323f7;border-top:1px solid #345b7e;padding:9px 3px max(12px,env(safe-area-inset-bottom));z-index:4}.footnav button{color:#a8cbe6;background:none;border:0;font-size:11px;padding:6px;min-width:55px}.footnav button.active{color:#5dc3ff}.hero{position:relative;overflow:hidden;border:1px solid #315a81;border-radius:18px;background:radial-gradient(ellipse at 65% 30%,#17416b,#081321 68%);padding:22px 17px;margin-bottom:14px;min-height:160px;display:flex;flex-direction:column;justify-content:center}.hero:before{content:' ';position:absolute;right:-10%;top:-50%;width:65%;height:220%;background:repeating-conic-gradient(from 12deg at 50% 50%,#54baff19 0deg 8deg,transparent 9deg 25deg);border-radius:50%;filter:blur(2px);pointer-events:none}.hero strong{position:relative;font-size:clamp(34px,7vw,64px);letter-spacing:3px;text-shadow:0 0 28px #42baff88}.hero p{position:relative;color:#a9c5dc;max-width:450px}.studio-crest{width:82px;height:82px;display:grid;place-items:center;border:2px solid #c39a4a;border-radius:24px;transform:rotate(-7deg);background:linear-gradient(145deg,#483215,#0b1722);box-shadow:0 0 28px #ffb52b35;color:#ffd879;font-size:48px;margin-bottom:18px}.home-stage{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:18px}.hero-art{position:relative;min-height:225px;border:1px solid #35597c;border-radius:17px;overflow:hidden;background:linear-gradient(180deg,#0c1a2a40,#06101de0),url('genesis-reference.png') center 7%/cover no-repeat}.hero-art:after{content:'BIG GAMES START SMALL';position:absolute;bottom:14px;right:14px;color:#fff;font-weight:900;letter-spacing:1px;text-shadow:0 2px 8px #000}.hero-art-label{position:absolute;top:15px;left:15px;background:#061525dd;border:1px solid #4b8fc3;border-radius:8px;padding:8px 11px;font-weight:800;color:#87d8ff}.division-top{font-size:11px;letter-spacing:2px;color:#83c8f4;margin-bottom:12px}.hidden{display:none!important}.pill{color:#9aecc5;font-size:11px}.danger{border-color:#a94e5c;color:#ffadb6}body.reduce-motion *,body.reduce-motion *:before,body.reduce-motion *:after{animation:none!important;transition:none!important}@media(min-width:800px){.home-stage{grid-template-columns:1fr 1fr}.hero-art{min-height:270px}.layout{padding:25px 30px 70px}.grid{grid-template-columns:repeat(5,1fr)}.footnav{position:static;justify-content:center;gap:35px}.launch{min-height:155px}.hero{min-height:220px}}
</style></head><body><header><div class="brand">SQUIRREL STUDIOS <span style="color:#56baff">GENESIS</span></div><div class="tagline">DESIGN · CREATE · CODE · BUILD · TEST · DEPLOY</div></header><main class="layout"><div class="headline"><h1 id="pageTitle">Headquarters</h1><span class="status">● OFFLINE WORKSPACE</span></div><div id="content"></div></main><nav class="footnav" aria-label="Main navigation"><button data-nav="home">⌂ Home</button><button data-nav="operations">▣ Projects</button><button data-nav="forge">⬡ Forge</button><button data-nav="codex">⌘ Codex</button><button data-nav="settings">⚙ Settings</button></nav><script>
(function(){'use strict';
const divisions=[['operations','◈','OPERATIONS','Projects, tasks, assets and build records'],['forge','⬡','FORGE','Model and texture asset registry'],['codex','⌘','CODEX','Local script editor and saved revisions'],['nexus','✧','NEXUS','AI connection status and development prompts'],['build','⬢','BUILD','Build preparation and package tracking'],['market','◆','MARKET','Internal asset library and catalogs'],['tools','▣','TOOLS','Workspace data and export utilities'],['diagnostics','◉','DIAGNOSTICS','Storage and application checks'],['settings','⚙','SETTINGS','Preferences, backups and privacy']];
const keys=['projects','tasks','assets','builds','scripts','catalog'];let page='home',tab='projects';const content=document.getElementById('content');const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function read(k){try{const v=JSON.parse(localStorage.getItem('genesis.v2.'+k)||'[]');return Array.isArray(v)?v:[]}catch(e){return []}}function write(k,v){try{localStorage.setItem('genesis.v2.'+k,JSON.stringify(v));return true}catch(e){alert('Unable to save local data: '+e.message);return false}}function panel(title,body){return '<section class="panel"><h2>'+title+'</h2>'+body+'</section>'}function notice(s){return '<p class="empty">'+escape(s)+'</p>'}function list(k){const a=read(k);if(!a.length)return notice('No '+k+' recorded yet. Create the first record below.');return a.map(x=>'<div class="item"><div class="detail"><b>'+escape(x.text)+'</b><small>'+escape(x.detail||'Local record')+(x.done?' · Completed':'')+'</small></div>'+(k==='tasks'?'<button class="ghost" data-action="done" data-id="'+escape(x.id)+'">'+(x.done?'Undo':'Done')+'</button>':'')+'<button class="ghost" data-action="edit" data-id="'+escape(x.id)+'">Edit</button><button class="ghost danger" data-action="remove" data-id="'+escape(x.id)+'">Delete</button></div>').join('')}function form(k){return '<form id="recordForm"><input class="field" name="text" maxlength="300" placeholder="New '+escape(k.slice(0,-1))+' name" required><input class="field" name="detail" maxlength="500" placeholder="Description / details"><button class="primary" type="submit">Add '+escape(k.slice(0,-1))+'</button></form>'}function records(k){tab=k;return panel(k.toUpperCase(),list(k)+form(k))}function tabs(items){return '<div class="tabs">'+items.map(k=>'<button data-tab="'+k+'" class="'+(tab===k?'active':'')+'">'+k[0].toUpperCase()+k.slice(1)+'</button>').join('')+'</div>'}function render(){const division=divisions.find(x=>x[0]===page);document.getElementById('pageTitle').textContent=division?division[2]:'Headquarters';document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===page));if(page==='home'){content.innerHTML='<div class="home-stage"><section class="hero"><span class="studio-crest">♞</span><span class="pill">● SQUIRREL STUDIOS · COMMAND CENTER</span><strong>GENESIS</strong><p>THE COMPLETE GAME DEVELOPMENT WORKSTATION<br>DESIGN · CREATE · CODE · BUILD · TEST · DEPLOY</p></section><section class="hero-art"><span class="hero-art-label">SQUIRREL STUDIOS</span></section></div><div class="division-top">LAUNCH YOUR WORKSPACE</div><div class="grid">'+divisions.map(x=>'<button class="launch" data-id="'+x[0]+'"><span class="symbol">'+x[1]+'</span><b>'+x[2]+'</b><small>'+x[3]+'</small></button>').join('')+'</div>'+panel('WORKSPACE SUMMARY','<div class="row"><span>Projects: '+read('projects').length+'</span><span>Tasks: '+read('tasks').length+'</span><span>Assets: '+read('assets').length+'</span><span>Scripts: '+read('scripts').length+'</span></div>');return}
if(page==='operations'){if(!['projects','tasks','assets','builds'].includes(tab))tab='projects';content.innerHTML=tabs(['projects','tasks','assets','builds'])+records(tab);return}
if(page==='forge'){tab='assets';content.innerHTML=panel('ASSET WORKSPACE',notice('Manage model, texture and animation records locally. Native 3D sculpting and rendering require a connected desktop engine.'))+records('assets');return}
if(page==='codex'){content.innerHTML=panel('LOCAL CODE EDITOR','<label>Script name<input class="field" id="scriptName" placeholder="example.lua" maxlength="100"></label><textarea class="field editor" id="scriptBody" spellcheck="false" placeholder="Write or paste source code here"></textarea><div class="row"><button class="primary" data-action="save-script">Save script</button><button class="ghost" data-action="new-script">New</button></div>')+panel('SAVED SCRIPTS',read('scripts').map(s=>'<div class="item"><div class="detail"><b>'+escape(s.text)+'</b><small>'+escape(s.detail||'Local script')+'</small></div><button class="ghost" data-action="open-script" data-id="'+escape(s.id)+'">Open</button><button class="ghost danger" data-action="delete-script" data-id="'+escape(s.id)+'">Delete</button></div>').join('')||notice('No scripts saved yet.'));return}
if(page==='nexus'){content.innerHTML=panel('NEXUS CONNECTION',notice('AI provider is not connected. No fake chat replies or generated assets will be shown.'))+panel('DEVELOPMENT PROMPT DRAFT','<textarea id="promptDraft" class="field" rows="7" placeholder="Draft a development request here"></textarea><button class="primary" data-action="copy-prompt">Copy request</button>');return}
if(page==='build'){tab='builds';content.innerHTML=panel('BUILD PREPARATION',notice('Track build jobs and output packages. Actual APK/PC compilation requires a configured build runner; this phone screen does not claim to compile software.'))+records('builds');return}
if(page==='market'){tab='catalog';content.innerHTML=panel('INTERNAL ASSET CATALOG',notice('Catalog your own assets and source locations. Online purchases and downloads are not connected.'))+records('catalog');return}
if(page==='tools'){content.innerHTML=panel('DATA UTILITIES','<button class="primary" data-action="export">Export complete JSON backup</button><textarea class="field hidden" id="exportText" rows="10" readonly></textarea>')+panel('WORKSPACE COUNTS',keys.map(k=>'<div class="item"><div class="detail">'+escape(k)+'</div><b>'+read(k).length+'</b></div>').join(''));return}
if(page==='diagnostics'){let ok=true;try{const key='genesis.storage.test';localStorage.setItem(key,'ok');ok=localStorage.getItem(key)==='ok';localStorage.removeItem(key)}catch(e){ok=false}content.innerHTML=panel('LOCAL DIAGNOSTICS','<div class="item">Local storage <b style="margin-left:auto">'+(ok?'PASS':'FAIL')+'</b></div><div class="item">JavaScript runtime <b style="margin-left:auto">PASS</b></div><div class="item">Data collections <b style="margin-left:auto">'+keys.length+'</b></div>'+notice('CPU, GPU, RAM and device temperature require native diagnostic integration. No fabricated readings are displayed.'));return}
if(page==='settings'){content.innerHTML=panel('APPEARANCE','<label><input type="checkbox" id="reduceMotion" '+(localStorage.getItem('genesis.motion')==='off'?'checked':'')+'> Reduce motion</label>')+panel('DATA & PRIVACY',notice('Workspace records are stored on this device. Uninstalling may delete them. Export a backup before uninstalling.')+'<button class="primary" data-action="export">Export backup</button><textarea class="field hidden" id="exportText" rows="10" readonly></textarea>')+panel('ABOUT','Squirrel Studios Genesis · Integrated rebuild foundation · Offline-first');return}}
function navigate(p){page=p;tab='projects';render();window.scrollTo(0,0)}document.addEventListener('click',function(e){const nav=e.target.closest('[data-nav]');if(nav){navigate(nav.dataset.nav);return}const launch=e.target.closest('[data-id]');if(launch){navigate(launch.dataset.id);return}const t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;render();return}const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action,id=b.dataset.id;if(['remove','edit','done'].includes(action)){const a=read(tab),x=a.find(v=>v.id===id);if(!x)return;if(action==='remove'){if(!confirm('Delete this record?'))return;if(write(tab,a.filter(v=>v.id!==id)))render()}else if(action==='done'){x.done=!x.done;if(write(tab,a))render()}else{const value=prompt('Edit name',x.text);if(value!==null&&value.trim()){x.text=value.trim().slice(0,300);if(write(tab,a))render()}}return}if(action==='save-script'){const name=document.getElementById('scriptName').value.trim(),body=document.getElementById('scriptBody').value;if(!name){alert('Enter a script name');return}const a=read('scripts'),existing=a.find(x=>x.text===name);if(existing){existing.body=body;existing.detail='Updated '+new Date().toLocaleString()}else a.unshift({id:Date.now().toString(36),text:name,body,detail:'Saved '+new Date().toLocaleString()});if(write('scripts',a))render()}if(action==='open-script'){const s=read('scripts').find(x=>x.id===id);if(s){document.getElementById('scriptName').value=s.text;document.getElementById('scriptBody').value=s.body||''}}if(action==='delete-script'){if(confirm('Delete this script?')&&write('scripts',read('scripts').filter(x=>x.id!==id)))render()}if(action==='new-script'){document.getElementById('scriptName').value='';document.getElementById('scriptBody').value=''}if(action==='copy-prompt'){const el=document.getElementById('promptDraft');el.select();document.execCommand('copy')}if(action==='export'){const backup={schema:2,exportedAt:new Date().toISOString()};keys.forEach(k=>backup[k]=read(k));const el=document.getElementById('exportText');el.value=JSON.stringify(backup,null,2);el.classList.remove('hidden');el.focus();el.select()}});document.addEventListener('submit',function(e){if(e.target.id!=='recordForm')return;e.preventDefault();const f=e.target,fd=new FormData(f),text=String(fd.get('text')||'').trim();if(!text)return;const a=read(tab);a.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2),text,detail:String(fd.get('detail')||''),done:false});if(write(tab,a))render()});document.addEventListener('change',e=>{if(e.target.id==='reduceMotion'){localStorage.setItem('genesis.motion',e.target.checked?'off':'on');document.body.classList.toggle('reduce-motion',e.target.checked)}});document.body.classList.toggle('reduce-motion',localStorage.getItem('genesis.motion')==='off');window.genesisBack=function(){if(page!=='home'){navigate('home');return true}return false};render()})();
</script></body></html>
