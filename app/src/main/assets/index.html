const oldKey=k=>'genesis.v2.'+k;const key=k=>'genesis.v3.'+k;let page='home',tab='Projects',currentFile='main.lua';let selectedGame='',selectedGameFolder='';const colors={operations:'#288fff',forge:'#ffa32d',codex:'#b65aff',nexus:'#17d9bd',build:'#ff465d',market:'#ffcf54',tools:'#31b8ff',diagnostics:'#28dcb5',settings:'#60aeff'};const icons={operations:'⬡',forge:'⬡',codex:'⌘',nexus:'✧',build:'⬢',market:'◆',tools:'⚒',diagnostics:'✿',settings:'⚙'};

const genesisGameNoteKey='genesis.gameNotes.v1';
let gameEditorId='';
let gameNotesError='';
function gameNotesRead(){
try{const raw=localStorage.getItem(genesisGameNoteKey);if(!raw)return {};const value=JSON.parse(raw);return value&&typeof value==='object'&&!Array.isArray(value)?value:{}}catch(e){gameNotesError='Stored game notes could not be read. Existing notes have not been overwritten.';return null}
}
function gameNotesWrite(notes){try{localStorage.setItem(genesisGameNoteKey,JSON.stringify(notes));gameNotesError='';return true}catch(e){gameNotesError='Could not save notes to device storage. Check available space and app storage settings.';return false}}
function currentGameFolderKey(){return selectedGame+'::'+selectedGameFolder}
function safeGameUrl(url){try{const u=new URL(url);return u.protocol==='https:'?u.href:''}catch(e){return ''}}

];
function beginGameNote(id){gameEditorId=id||'new';render()}
function cancelGameNote(){gameEditorId='';render()}
function saveGameNote(){
const title=document.getElementById('gameNoteTitle')?.value.trim()||'';
const body=document.getElementById('gameNoteBody')?.value.trim()||'';
const source=document.getElementById('gameNoteSource')?.value.trim()||'';
if(!title||!body){notify('Enter a title and note text.');return}
if(title.length>140||body.length>6000){notify('Note exceeds maximum length.');return}
if(source&&!safeGameUrl(source)){notify('Source must be a complete HTTPS URL.');return}
const data=gameNotesRead();if(!data){render();return}
const folder=currentGameFolderKey(),a=Array.isArray(data[folder])?data[folder]:[];
const old=gameEditorId==='new'?null:a.find(n=>n.id===gameEditorId);
if(gameEditorId!=='new'&&!old){notify('Note no longer exists.');return}
const time=new Date().toISOString();
const note={id:old?old.id:'gn-'+Date.now()+'-'+Math.random().toString(36).slice(2),title,body,source,createdAt:old?old.createdAt:time,updatedAt:time,type:'personal'};
const next=old?a.map(n=>n.id===old.id?note:n):[note,...a];
data[folder]=next;
if(!gameNotesWrite(data)){render();return}
gameEditorId='';render();notify('Game note saved on this device')
}
function deleteGameNote(id){
if(!confirm('Delete this game note?'))return;
const data=gameNotesRead();if(!data)return;
const folder=currentGameFolderKey();data[folder]=(Array.isArray(data[folder])?data[folder]:[]).filter(n=>n.id!==id);
if(gameNotesWrite(data)){gameEditorId='';render();notify('Game note deleted')}
}

}

 return showing.map(f=>{
 const url=safeGameUrl(f.url);
 const status=f.evidence==='publisher'?'Publisher documented':'Community documented · ASA verification pending';
 const source=url?'<a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">Evidence: '+esc(f.source)+' ↗</a>':'<small>Evidence URL unavailable</small>';
 return '<article class="gamefact rag-fact"><div class="rag-fact-meta"><span>'+esc(f.category)+'</span><small class="'+(f.evidence==='publisher'?'rag-primary':'rag-secondary')+'">'+status+'</small></div><b>'+esc(f.title)+'</b><p>'+esc(f.detail)+'</p>'+source+'</article>'
 }).join('');
}
function updateRagResults(){
 const el=document.getElementById('ragResults');
 if(el)el.innerHTML=renderRagFactCards();
 const count=document.getElementById('ragCount');
 const total=ragFilteredFacts().length;
 if(count)count.textContent='Showing '+Math.min(total,ragLimit)+' of '+total+' matching references';
 const more=document.getElementById('ragMore');
 if(more)more.hidden=total<=ragLimit;
}
function filterRagnarokFacts(){
 ragSearch=document.getElementById('ragSearch')?.value||'';
 ragCategory=document.getElementById('ragCategory')?.value||'All';
 ragLimit=12;updateRagResults();
}
function moreRagnarokFacts(){ragLimit+=12;updateRagResults()}
function renderRagnarokKnowledge(){
 const total=ragAllFacts().length;
 const count=ragFactsSelected().length;
 const title=ragPacks.find(x=>x.id===ragActivePack);
 let h='<div class="panel rag-library"><h3>RAGNAROK ASCENDED / INTELLIGENCE LIBRARY</h3>'+
 '<p class="empty">Three major reference updates, available offline. Publisher facts and community-wiki documentation are clearly identified; precise coordinates, server-modified rates and individual game-file values are NOT yet verified.</p>';
 h+='<div class="rag-pack-grid">'+ragPacks.map(pack=>'<button class="rag-pack-btn '+(ragActivePack===pack.id?'rag-pack-active':'')+'" onclick="setRagPack(\''+pack.id+'\')"><b>'+esc(pack.title)+'</b><small>'+esc(pack.sub)+'</small></button>').join('')+'</div>';
 h+='<button class="secondary rag-all-btn '+(ragActivePack==='all'?'rag-all-active':'')+'" onclick="setRagPack(\'all\')">Search all '+total+' entries (including original '+(window.GENESIS_RAGNAROK_FACTS||[]).length+')</button>';
 h+='<div class="rag-selected"><b>'+esc(title?.title||'Complete Ragnarok Index')+'</b><small>'+count+' references in this view</small></div>';
 if(!total)return h+'<p class="game-error">Ragnarok reference files are unavailable. Your saved personal notes are unaffected.</p></div>';
 h+='<div class="rag-filters"><input class="field" id="ragSearch" type="search" value="'+esc(ragSearch)+'" placeholder="Search facts, creatures, loot…" aria-label="Search Ragnarok facts" oninput="filterRagnarokFacts()"><select class="field" id="ragCategory" aria-label="Filter Ragnarok category" onchange="filterRagnarokFacts()">'+ragCategories().map(cat=>'<option value="'+esc(cat)+'"'+(cat===ragCategory?' selected':'')+'>'+esc(cat)+'</option>').join('')+'</select></div>';
 h+='<p class="sub" id="ragCount">Showing '+Math.min(ragLimit,ragFilteredFacts().length)+' of '+ragFilteredFacts().length+' matching references</p>';
 h+='<div id="ragResults">'+renderRagFactCards()+'</div>';
 h+='<button id="ragMore" class="secondary rag-more" onclick="moreRagnarokFacts()" '+(ragFilteredFacts().length<=ragLimit?'hidden':'')+'>Show 12 more references</button>';
 return h+'</div>';
}

function gamePage(){
let h=heading('MY GAMES','Game companion workspace · local notes and source-backed references');
h+='<div class="panel"><button class="secondary" onclick="gameBack()">← Back</button> <button class="secondary" onclick="gameHome()">All games</button></div>';
if(!selectedGame){
h+='<div class="panel"><h3>SELECT GAME</h3><p class="sub">Choose a dedicated companion workspace. Your notes remain on this device.</p></div>';
for(const id of Object.keys(genesisGameFolders)){
h+='<button class="gamefolder" onclick="selectGame(\''+id+'\')"><span class="gamefoldericon">▣</span><span><b>'+esc(id)+'</b><small>'+esc(genesisGameFullNames[id])+'</small></span><span class="gamefolderarrow">›</span></button>'}
return h+'</div>'}
h+='<div class="panel"><h3>'+esc(selectedGame)+' · '+esc(genesisGameFullNames[selectedGame])+'</h3></div>';
if(selectedGameFolder){
h+='<div class="panel"><p class="sub">MY GAMES / '+esc(selectedGame)+' / '+esc(selectedGameFolder)+'</p><h3>'+esc(selectedGameFolder)+'</h3></div>';
if(selectedGame==='ASA'&&selectedGameFolder==='Maps & Caves')h+='<div class="panel"><h3>MAPS IN THE REFERENCE LIBRARY</h3><p class="empty">Ragnarok is the first curated Ascended map. Other maps can be added as evidence is collected.</p><button class="action" onclick="selectGameFolder(&quot;Ragnarok&quot;)">Open Ragnarok Reference Library</button></div>';
if(selectedGame==='ASA'&&selectedGameFolder==='Ragnarok'){h+=renderRagnarokKnowledge()}else if(selectedGame==='ASA'){h+=(selectedGameFolder==='Dashboard'?renderRagDashboard():'')+renderRagFolderFacts(selectedGameFolder)}else{
const facts=genesisVerifiedFacts.filter(f=>f.game===selectedGame&&f.folder===selectedGameFolder);
h+='<div class="panel"><h3>OFFICIAL-SOURCE REFERENCES</h3><p class="empty">Reference facts are linked to original published sources. This is not an automatically updated game database; check version-specific details against your installed game.</p>';
if(!facts.length)h+='<p class="empty">No independently sourced reference entries for this folder yet.</p>';
for(const f of facts){const url=safeGameUrl(f.url);h+='<div class="gamefact"><b>'+esc(f.title)+'</b><p>'+esc(f.detail)+'</p><a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">Source: '+esc(f.source)+' ↗</a></div>'}
h+='</div>';
}
const data=gameNotesRead();
const notes=data&&Array.isArray(data[currentGameFolderKey()])?data[currentGameFolderKey()]:[];
h+='<div class="panel"><div class="game-notes-head"><h3>MY NOTES ('+notes.length+')</h3><button class="action" onclick="beginGameNote()">+ Add Note</button></div><p class="empty">Your entries are personal notes, not independently verified facts. An optional source link remains labeled unverified until checked.</p>';
if(gameNotesError)h+='<p class="game-error" role="alert">'+esc(gameNotesError)+'</p>';
if(gameEditorId){
const original=gameEditorId==='new'?null:notes.find(n=>n.id===gameEditorId);
h+='<div class="game-note-editor"><h3>'+ (original?'EDIT NOTE':'NEW NOTE')+'</h3><label for="gameNoteTitle">Title</label><input class="field" id="gameNoteTitle" maxlength="140" placeholder="Item, location, recipe, discovery…" value="'+esc(original?.title||'')+'"><label for="gameNoteBody">Details</label><textarea class="field" id="gameNoteBody" rows="6" maxlength="6000" placeholder="Write your notes, quantities, coordinates, tests, or instructions">'+esc(original?.body||'')+'</textarea><label for="gameNoteSource">Evidence link (optional, HTTPS)</label><input class="field" id="gameNoteSource" type="url" maxlength="1500" placeholder="https://..." value="'+esc(original?.source||'')+'"><div class="game-note-actions"><button class="action" onclick="saveGameNote()">Save Note</button><button class="secondary" onclick="cancelGameNote()">Cancel</button></div></div>'}
if(!notes.length)h+='<p class="empty">No personal notes here yet. Tap + Add Note.</p>';
for(const n of notes){
if(!n||typeof n.id!=='string')continue;
h+='<div class="gamefact game-personal"><b>'+esc(n.title)+'</b><small>Personal note · '+esc((n.updatedAt||'').slice(0,10))+'</small><p class="game-note-body">'+esc(n.body)+'</p>';
if(n.source){const url=safeGameUrl(n.source);if(url)h+='<a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">Your source (not independently verified) ↗</a>'}
h+='<div class="game-note-actions"><button class="secondary" onclick="beginGameNote(\''+esc(n.id)+'\')">Edit</button><button class="secondary" onclick="deleteGameNote(\''+esc(n.id)+'\')">Delete</button></div></div>'}
h+='</div>';
return h+'</div>'}
h+='<div class="panel"><label for="gameFolderSearch">Search folders</label><input id="gameFolderSearch" class="field" type="search" placeholder="Search '+esc(selectedGame)+' folders" oninput="filterGameFolders(this.value)"></div>';
for(const name of genesisGameFolders[selectedGame]){
h+='<button class="gamefolder" data-gamefolder="'+esc(name)+'" onclick="selectGameFolder(\''+name+'\')"><span class="gamefoldericon">▤</span><span><b>'+esc(name)+'</b><small>'+esc(selectedGame==='ASA'?(ragSlotFacts(name).length+' source-backed entries · + notes'):'Reference facts + your notes')+'</small></span><span class="gamefolderarrow">›</span></button>'}
return h+'</div>'
}

function render(){let h='';if(page==='home'){const p=read('projects'),t=read('tasks');h='<div class="hero"><div class="skyline"></div><div class="hero-copy"><span class="eyebrow">SQUIRREL STUDIOS / WORKSTATION</span><h1>BIG GAMES<br>START SMALL.</h1><p>Design · Create · Code · Build · Test · Deploy</p></div></div><div class="sectiontitle"><b>STUDIO MODULES</b><small>SELECT WORKSPACE</small></div><div class="tiles">'+card('operations','Project manager')+card('forge','Asset creation')+card('codex','Code editor')+card('nexus','AI assistant')+card('build','Compile & deploy')+card('market','Local asset library')+'</div><div class="sectiontitle"><b>MY GAMES</b><small>COMPANION WORKSPACE</small></div><div class="panel"><button class="action" onclick="openPage(&quot;games&quot;)">Open 7D2D · GTA5 · RDR2 · ARK folders ›</button></div><div class="sectiontitle"><b>WORKSPACE OVERVIEW</b><small>ON-DEVICE DATA</small></div><div class="summary"><div><strong>'+p.length+'</strong><small>PROJECTS</small></div><div><strong>'+t.filter(x=>!x.done).length+'</strong><small>OPEN TASKS</small></div><div><strong>'+read('notes').length+'</strong><small>NOTES</small></div></div><div class="footerhint">SQUIRREL STUDIOS · YOUR STUDIO, ANYWHERE.</div>'}
else if(page==='games'){h=gamePage()}
else if(page==='operations'){const names=['Projects','Tasks','Assets','Builds','Notes'];h=heading('OPERATIONS','Project manager · local workspace')+tabs(names);const map={Projects:'projects',Tasks:'tasks',Assets:'assets',Builds:'builds',Notes:'notes'},k=map[tab];h+='<div class="panel"><h3>ADD '+tab.toUpperCase()+'</h3><input id="entry" class="field" maxlength="300" placeholder="'+(tab==='Tasks'?'Task description':'Name or description')+'"><button class="action" onclick="addEntry(\''+k+'\')">+ Add '+tab.slice(0,-1)+'</button></div><div class="panel"><h3>'+tab.toUpperCase()+' · '+read(k).length+'</h3>'+rows(k)+'</div></div>'}
else if(page==='forge'){h=heading('FORGE','Asset creation · local catalog')+tabs(['Models','Textures','Animations','Audio']);h+='<div class="forgepreview"><span class="mesh">'+({Models:'⬡',Textures:'▦',Animations:'♙',Audio:'♫'}[tab])+'</span></div><div class="panel"><h3>'+tab.toUpperCase()+' LIBRARY</h3><input id="entry" class="field" maxlength="200" placeholder="Asset name"><button class="action" onclick="addEntry(\'forge_'+tab+'\')">+ Register asset</button><p class="empty">Local asset inventory only. 3D editing, import, rigging and export require a native engine integration.</p>'+rows('forge_'+tab)+'</div></div>'}
else if(page==='codex'){let files=read('codefiles');if(!files.length){files=[{id:'default',text:'main.lua',code:'-- Squirrel Studios Genesis\n-- Your local code workspace\n\nfunction init()\n  print("Genesis ready")\nend\n'}];write('codefiles',files)}if(!files.some(x=>x.text===currentFile))currentFile=files[0].text;const file=files.find(x=>x.text===currentFile);h=heading('CODEX','Local code editor · manual save')+'<div class="panel"><div class="tabs">'+files.map(x=>'<button class="'+(x.text===currentFile?'active':'')+'" onclick="selectFile(\''+esc(x.id)+'\')">'+esc(x.text)+'</button>').join('')+'</div><textarea class="field editor" id="code" spellcheck="false" autocapitalize="off">'+esc(file.code||'')+'</textarea><button class="action" onclick="saveCode()">Save file</button><button class="secondary" onclick="newFile()">+ New file</button><button class="secondary" onclick="copyCode()">Copy source</button><button class="secondary" onclick="deleteFile()">Delete file</button><p class="empty">Edits are saved on this device. No compiler or remote execution is connected.</p></div></div>'}
else if(page==='nexus'){h=heading('NEXUS','AI assistant · connection pending')+'<div class="panel nexus"><div class="nexusorb">✧</div><h3 style="text-align:center;color:#6df6e4">NEXUS INTELLIGENCE</h3><p class="empty" style="text-align:center">NEXUS is not connected to an AI service. Local prompts can be saved as a planning queue; no AI response will be fabricated.</p></div><div class="panel"><textarea id="entry" class="field" rows="3" placeholder="Describe an idea or engineering task"></textarea><button class="action" onclick="addEntry(\'nexusqueue\')">Save to queue</button>'+rows('nexusqueue')+'</div></div>'}
else if(page==='build'){h=heading('BUILD','Compile & deploy · release workspace')+tabs(['Android','PC','Console','Mod Package']);h+='<div class="panel"><h3>'+tab.toUpperCase()+' RELEASE PLANNING</h3><p class="empty">This app cannot compile an APK on-device. The GitHub build pipeline is external; use this page to track release requests without pretending to compile.</p><input class="field" id="entry" placeholder="Release name / version"><button class="action" onclick="addEntry(\'release_'+tab+'\')">+ Add release request</button>'+rows('release_'+tab)+'</div></div>'}
else if(page==='market'){h=heading('MARKET','Personal asset catalog · no online store')+tabs(['Assets','Mods','Tools','Collections']);h+='<div class="panel"><h3>LOCAL '+tab.toUpperCase()+'</h3><input class="field" id="entry" placeholder="Asset or collection name"><button class="action" onclick="addEntry(\'market_'+tab+'\')">+ Add to library</button>'+rows('market_'+tab)+'</div></div>'}
else if(page==='tools'){h=heading('TOOLS','Utility suite')+'<div class="tiles">'+[['File Manager','Native file access not connected'],['Image Editor','Planned integration'],['Audio Editor','Planned integration'],['APK Signer','Signed by GitHub workflow'],['Performance','Device telemetry not connected'],['Backup','Export your local data']].map((x,i)=>'<button class="tile" style="--c:#36b7ff" onclick="'+(i===5?'backup()':'notify(\'This tool is not connected yet\')')+'"><span class="ico">'+['▣','▧','♫','♢','◉','⇩'][i]+'</span><b>'+x[0]+'</b><small>'+x[1]+'</small></button>').join('')+'</div><div id="backupPanel"></div></div>'}
else if(page==='diagnostics'){const counts=['projects','tasks','notes','assets','builds','codefiles'].map(x=>read(x).length);h=heading('DIAGNOSTICS','Local application health · no fake hardware readings')+'<div class="meter"><div><b>'+counts[0]+'</b><small>PROJECTS</small></div><div><b>'+counts[1]+'</b><small>TASKS</small></div><div><b>'+counts[2]+'</b><small>NOTES</small></div></div><div class="panel"><h3>LOCAL DATA STATUS</h3><p class="empty">On-device browser storage: '+(storageWorks()?'Available':'Unavailable')+'</p><p class="empty">CPU / RAM / GPU: Not connected to Android telemetry.</p><p class="empty">Cloud synchronization: Not connected.</p><button class="action" onclick="render()">Refresh local check</button></div></div>'}
else if(page==='settings'){h=heading('SETTINGS','Customize your workstation')+'<div class="panel"><div class="settingsrow"><div><b>Reduced motion</b><small>Disable interface animations</small></div><input type="checkbox" id="motion" '+(localStorage.getItem('genesis.lowMotion')==='true'?'checked':'')+' onchange="setMotion(this.checked)"></div><div class="settingsrow"><div><b>Local data backup</b><small>Copy a JSON backup of your projects and notes</small></div><button class="secondary" onclick="backup()">Export</button></div><div class="settingsrow"><div><b>Version</b><small>Genesis v0.8.3 · Ragnarok data</small></div></div><div class="settingsrow"><div><b>Signing</b><small>Permanent release signing through GitHub</small></div></div></div><div id="backupPanel"></div></div>'}
document.getElementById('screen').innerHTML=h}
function rows(k){const a=read(k);if(!a.length)return '<p class="empty">Nothing saved here yet.</p>';return a.map(x=>'<div class="rowitem">'+(k==='tasks'?'<input type="checkbox" '+(x.done?'checked':'')+' onchange="toggleDone(\''+esc(x.id)+'\')">':'')+'<div class="content"><b style="'+(x.done?'text-decoration:line-through':'')+'">'+esc(x.text)+'</b></div><button class="secondary" onclick="editEntry(\''+k+'\',\''+esc(x.id)+'\')">Edit</button><button class="secondary" onclick="removeEntry(\''+k+'\',\''+esc(x.id)+'\')">×</button></div>').join('')}
function addEntry(k){const e=document.getElementById('entry');const t=e.value.trim();if(!t)return;const a=read(k);a.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2),text:t,done:false});write(k,a);render();notify('Saved locally')}function removeEntry(k,id){if(!confirm('Delete this entry?'))return;write(k,read(k).filter(x=>x.id!==id));render()}function editEntry(k,id){const a=read(k),x=a.find(x=>x.id===id);if(!x)return;const t=prompt('Edit',x.text);if(t===null||!t.trim())return;x.text=t.trim();write(k,a);render()}function toggleDone(id){const a=read('tasks'),x=a.find(x=>x.id===id);if(x){x.done=!x.done;write('tasks',a);render()}}
function selectFile(id){const x=read('codefiles').find(x=>x.id===id);if(x){if(document.getElementById('code')&&!confirm('Switch file? Save current edits first.'))return;currentFile=x.text;render()}}function saveCode(){const a=read('codefiles'),x=a.find(x=>x.text===currentFile);if(x){x.code=document.getElementById('code').value;write('codefiles',a);notify('Code saved locally')}}function newFile(){const name=prompt('Filename (example: script.lua)');if(!name||!name.trim())return;const a=read('codefiles');if(a.some(x=>x.text===name.trim())){notify('Filename already exists');return}a.push({id:Date.now().toString(36),text:name.trim(),code:''});write('codefiles',a);currentFile=name.trim();render()}function deleteFile(){if(!confirm('Delete this code file?'))return;const a=read('codefiles').filter(x=>x.text!==currentFile);write('codefiles',a);currentFile=a.length?a[0].text:'main.lua';render()}function copyCode(){const e=document.getElementById('code');e.select();document.execCommand('copy');notify('Source selected / copy requested')}
function backup(){const o={version:3,exportedAt:new Date().toISOString(),data:{}};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('genesis.v2.')||k.startsWith('genesis.v3.')||k===genesisGameNoteKey)o.data[k]=localStorage.getItem(k)}const e=document.getElementById('backupPanel');e.innerHTML='<div class="panel"><h3>LOCAL BACKUP</h3><textarea class="field" id="backupText" rows="7" readonly></textarea><button class="secondary" onclick="selectBackup()">Select all</button></div>';document.getElementById('backupText').value=JSON.stringify(o,null,2);notify('Backup prepared — copy and store safely')}function selectBackup(){const e=document.getElementById('backupText');e.select();document.execCommand('copy')}function storageWorks(){try{localStorage.setItem('genesis.healthcheck','1');localStorage.removeItem('genesis.healthcheck');return true}catch(e){return false}}function setMotion(x){localStorage.setItem('genesis.lowMotion',String(x));document.body.style.setProperty('scroll-behavior',x?'auto':'smooth')}openPage('home');
</script></body></html>
