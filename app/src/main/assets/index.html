function get(k,fallback){try{const x=JSON.parse(localStorage.getItem(K+k));return x===null?fallback:x}catch{return fallback}}
function put(k,value){try{localStorage.setItem(K+k,JSON.stringify(value));return true}catch{toast('Local storage is full or unavailable');return false}}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]))}
function attr(v){return escapeHtml(v)}
function uid(){return String(Date.now())+Math.random().toString(36).slice(2,8)}
function oldItems(k){const now=get(k,null);if(Array.isArray(now))return now;let entries=[];for(const p of ['genesis.v3.','genesis.v2.']){try{const a=JSON.parse(localStorage.getItem(p+k)||'[]');if(Array.isArray(a))entries.push(...a)}catch{}}const seen=new Set();const result=entries.filter(x=>{const id=String(x.id||x.text||'');if(!id||seen.has(id))return false;seen.add(id);return true}).map(x=>({id:String(x.id||uid()),text:String(x.text||'').slice(0,1000),done:!!x.done,project:String(x.project||'')}));put(k,result);return result}
const state={page:'home',drawerOpen:false,gameFilter:'all',query:'',game:'ark',imageSlots:{},imageIndex:{},artDb:null,rgb:get('rgb',{enabled:true,mode:'simple',brightness:85,speed:70,sync:true,motion:true,hex:'#63ff34'}),lowMotion:get('reduceMotion',false),currentSection:'',arkQuery:'',selectedCategory:'all',noteKind:'projects',viewList:'',activeRoute:-1};

function toast(text){const el=$('notification');el.textContent=text;el.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>{el.hidden=true},3100)}
function openDrawer(){document.getElementById('app').classList.add('nav-open');$('shade').hidden=false;state.drawerOpen=true;document.body.style.overflow='hidden'}
function closeDrawer(){document.getElementById('app').classList.remove('nav-open');$('shade').hidden=true;state.drawerOpen=false;document.body.style.overflow=''}
function navigate(to){const next=to==='7d2d'?'game':to;state.page=next;state.game=to==='7d2d'?'7d2d':state.game;state.query='';state.currentSection='';closeDrawer();render();$('main').scrollIntoView({behavior:'instant',block:'start'});try{history.replaceState(null,'','#'+encodeURIComponent(to))}catch{}}
function renderNav(){const node=$('navItems');node.innerHTML=NAV.map(([id,ico,label])=>`<button class="nav-btn ${((state.page==='game'&&state.game==='7d2d'&&id==='7d2d')||(state.page===id))?'active':''}" data-go="${id}"><span class="nav-icon">${ico}</span><span>${label}</span></button>`).join('');document.querySelectorAll('.bottom-dock button').forEach(b=>b.classList.toggle('active',b.dataset.go===state.page));}
function heading(kicker,title,icon,extra=''){return `<div class="panel-title"><div><span class="eyebrow">${escapeHtml(kicker)}</span><h1>${escapeHtml(title)}</h1></div><span class="title-glyph" aria-hidden="true">${icon}</span>${extra}</div>`}

function inputIcons(){return `<span class="input-badge" title="Keyboard" aria-label="Keyboard">⌨</span><span class="input-badge" title="Mouse" aria-label="Mouse"><svg viewBox="0 0 24 24" width="17" height="18" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3v8" stroke="currentColor" stroke-width="2"/></svg></span><span class="input-badge" title="Xbox controller" aria-label="Xbox controller"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 8C3.5 8 2 14 2 17c0 2 1 3 2.5 3 1.7 0 3.5-3 5.3-3h4.4c1.8 0 3.6 3 5.3 3 1.5 0 2.5-1 2.5-3 0-3-1.5-9-4-9H6z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M6 11v5m-2.5-2.5h5" stroke="currentColor" stroke-width="1.5"/><circle cx="16.5" cy="12" r="1.1" fill="#9fff57"/><circle cx="19" cy="14.6" r="1" fill="#9fff57"/></svg></span>`}
function gameCard(g){const slots=validIndexes(g),index=slots.includes(state.imageIndex[g.id])?state.imageIndex[g.id]:slots[0]??0,src=gameImage(g,index)||'',fav=get('favorites',[]).includes(g.id),installed=get('installed',[]).includes(g.id);return `<article class="game-card" data-game="${g.id}"><div class="art-frame"><img class="gallery-photo" data-slot="${index}" src="${attr(src)}" alt="${attr(g.name)} artwork ${index+1} of 3" loading="lazy"></div><div class="art-toolbar"><button type="button" class="art-step prev" data-action="slide" data-id="${g.id}" data-dir="-1" aria-label="Previous ${attr(g.short)} artwork">‹</button><div class="dots" role="group" aria-label="Artwork selection">${[0,1,2].map(i=>`<button type="button" class="dot ${i===index?'on':''}" aria-label="View artwork ${i+1} for ${attr(g.short)}" aria-pressed="${i===index}" data-action="jump" data-id="${g.id}" data-slot="${i}"></button>`).join('')}</div><span class="slide-counter">${index+1}/3</span><button type="button" class="art-step next" data-action="slide" data-id="${g.id}" data-dir="1" aria-label="Next ${attr(g.short)} artwork">›</button></div><div class="game-info"><div class="game-title-row"><strong>${escapeHtml(g.name)}</strong><button type="button" class="fave" data-action="favorite" data-id="${g.id}" aria-pressed="${fav}" aria-label="${fav?'Remove '+attr(g.short)+' from':'Add '+attr(g.short)+' to'} favorites">${fav?'★':'☆'}</button></div><div class="game-icons">${inputIcons()}<span class="tag">${installed?'INSTALLED (USER)':'LIBRARY'}</span></div><div class="game-foot"><span>● OFFLINE ARTWORK</span><em>${slots.length}/3 IMAGES • 12s PER CARD</em></div><div class="page-actions" style="margin:7px 0 0"><button class="metal" style="font-size:10px;padding:6px 8px" data-action="details" data-id="${g.id}">OPEN CARD</button><button class="metal" style="font-size:10px;padding:6px 8px" data-action="upload" data-id="${g.id}">ARTWORK</button></div></div></article>`}

function gameFilters(){const f=[['all','▦ ALL GAMES'],['favorites','★ FAVORITES'],['installed','⇩ INSTALLED'],['tools','⚒ TOOLS'],['updates','◌ UPDATES']];return `<div class="tabs">${f.map(([k,label])=>`<button class="metal ${state.gameFilter===k?'active':''}" data-filter="${k}">${label}</button>`).join('')}</div>`}

function renderGames(){const idsFav=get('favorites',[]),installed=get('installed',[]);let games=GAMES.filter(g=>(state.gameFilter==='favorites'?idsFav.includes(g.id):state.gameFilter==='installed'?installed.includes(g.id):true));games=games.filter(g=>(g.name+' '+g.short+' '+g.desc).toLowerCase().includes(state.query.toLowerCase()));if(['tools','updates'].includes(state.gameFilter))return `${heading('LIBRARY • TOOLS • COMPANIONS','MY GAMES','▧')}<div class="reactor-header"></div>${gameFilters()}<div class="pane"><h2>${state.gameFilter==='tools'?'GAME TOOLS':'UPDATES'}</h2><p>${state.gameFilter==='tools'?'Open a game card for notes and artwork management. Live game tools require a verified PC bridge.':'Automatic server/software update checks are not connected. Existing reference packs remain local.'}</p>${state.gameFilter==='tools'?`<div class="page-actions"><button class="metal" data-go="ark">ARK REFERENCE</button><button class="metal" data-go="projects">PROJECT TRACKER</button></div>`:''}</div>`;

function renderArk(){const list=[...ARK_CORE,...get('arkEntries',[])];const q=state.arkQuery.toLowerCase();const filtered=list.filter(x=>(state.selectedCategory==='all'||x.category===state.selectedCategory)&&(x.title+' '+x.info+' '+x.category).toLowerCase().includes(q));const cats=['all',...new Set(list.map(x=>x.category))];return `${heading('ARK: SURVIVAL ASCENDED • OFFLINE','ASA KNOWLEDGE LIBRARY','▲')}<div class="page-actions"><button class="metal gold" data-go="dinos">OPEN PERSONAL DINO TRACKER • 34 LOGGED</button></div><div class="pane"><div class="notice">This rebuilt interface contains a small clearly labeled starter reference. The full previously audited ARK packs must be migrated from the existing Genesis assets; this is not represented as the complete database.</div><div class="fields"><input id="arkSearch" class="search" placeholder="Search verified core facts..." value="${attr(state.arkQuery)}"><select id="arkCategory">${cats.map(c=>`<option ${state.selectedCategory===c?'selected':''} value="${attr(c)}">${escapeHtml(c==='all'?'ALL CATEGORIES':c)}</option>`).join('')}</select></div><div class="strip-status" style="margin:10px 0"><span>${filtered.length} ENTRIES MATCHING</span><span>ASA REFERENCE (NOT ASE)</span><span>USER NOTES SEPARATE</span></div>${filtered.map(x=>`<div class="pane" style="margin:9px 0"><span class="tag">${escapeHtml(x.category)}</span><h3 style="margin:8px 0">${escapeHtml(x.title)}</h3><p style="margin:0">${escapeHtml(x.info)}</p><small class="fine">Source / scope: ${escapeHtml(x.source||'Personal note')}</small></div>`).join('')||'<div class="empty">No matching facts.</div>'}</div><section class="pane"><h2>YOUR ARK REFERENCE NOTES</h2><div class="fields"><input id="arkTitle" placeholder="Entry title" maxlength="110"><input id="arkTag" placeholder="Category (e.g. Lost Colony)" maxlength="40"><textarea id="arkContent" placeholder="Write an accurate note..." maxlength="5000"></textarea><button class="metal" data-action="addArk">SAVE OFFLINE ENTRY</button></div></section>`}

function renderPrinting(){const p=get('printer',{name:'Ender 3 V3 SE',bedX:220,bedY:220,bedZ:250,material:'PLA'});return `${heading('FABRICATION • PROFILES','3D PRINTING','▣')}<section class="pane"><h2>PRINTER PROFILE</h2><div class="form-grid"><div class="fields"><label>Printer name<input id="printerName" value="${attr(p.name)}"></label><label>Bed width (mm)<input type="number" min="1" max="2000" id="bedX" value="${Number(p.bedX)||220}"></label><label>Bed depth (mm)<input type="number" min="1" max="2000" id="bedY" value="${Number(p.bedY)||220}"></label><label>Z build height (mm)<input type="number" min="1" max="2000" id="bedZ" value="${Number(p.bedZ)||250}"></label><label>Material<select id="material">${['PLA','PETG','TPU','ABS','ASA','Other'].map(m=>`<option ${m===p.material?'selected':''}>${m}</option>`).join('')}</select></label><button class="metal gold" data-action="savePrinter">SAVE PRINTER PROFILE</button></div><div class="pane"><h3>LOCAL SIZE CHECKER</h3><p class="small">Enter model bounding-box dimensions to see whether they fit your configured build volume (not a slicing or collision calculation).</p><div class="fields"><input type="number" min="0" id="modelX" placeholder="Model width in mm"><input type="number" min="0" id="modelY" placeholder="Model depth in mm"><input type="number" min="0" id="modelZ" placeholder="Model height in mm"><button class="metal" data-action="checkFit">CHECK MODEL SIZE</button><div id="fitResult" class="fine"></div></div></div></div></section>`}
function renderRoutes(){const routes=get('routes',[]);return `${heading('LOCAL ROUTE NOTEBOOK','ROUTES','◉')}<section class="pane"><div class="notice">This module stores offline route plans, not turn-by-turn navigation or live street maps.</div><div class="fields"><input id="routeName" placeholder="Route name"><textarea id="routeStops" placeholder="Stops, road names, safety notes and order"></textarea><button class="metal gold" data-action="addRoute">SAVE ROUTE</button></div></section><section class="pane"><h2>MY ROUTES</h2>${routes.map(x=>`<div class="table-row"><div class="grow"><b>${escapeHtml(x.name)}</b><small style="white-space:pre-wrap">${escapeHtml(x.stops)}</small></div><button class="metal" data-action="deleteRoute" data-id="${attr(x.id)}">DELETE</button></div>`).join('')||'<div class="empty">No routes saved.</div>'}</section>`}
function renderSettings(){const r=state.rgb;return `${heading('ILLUMINATION & WORKSTATION','RGB SETTINGS','✦')}<section class="pane"><h2>LIGHTING MODE</h2><div class="rgb-modes">${[['simple','SIMPLE RGB','✧'],['rainbow','RAINBOW CYCLE','∞'],['breathing','BREATHING','⌁'],['chase','CHASE / FLOW','»'],['pulse','PULSE','◉'],['static','STATIC COLOR','●'],['hyperfur','HYPER FUR MODE','✹']].map(([k,t,i])=>`<button class="metal ${r.mode===k?'active':''}" data-action="rgb" data-mode="${k}"><span style="display:block;font-size:21px;color:var(--gold)">${i}</span>${t}</button>`).join('')}</div></section><section class="pane"><h2>COLOR CONTROL</h2><div class="color-rainbow" style="margin-bottom:14px"></div><div class="form-grid"><label class="fields">Static accent color<input id="rgbHex" type="color" value="${attr(r.hex)}"></label><label class="fields">Brightness <span id="brightnessText">${r.brightness}%</span><input class="range" type="range" id="brightness" min="5" max="100" value="${r.brightness}"></label><label class="fields">Speed <span id="speedText">${r.speed}%</span><input class="range" type="range" id="speed" min="0" max="100" value="${r.speed}"></label></div><div class="rgb-switch"><b>RGB ENABLED</b><input type="checkbox" id="rgbEnabled" ${r.enabled?'checked':''}></div><div class="rgb-switch"><b>SYNC ALL ELEMENTS</b><input type="checkbox" id="rgbSync" ${r.sync?'checked':''}></div><div class="rgb-switch"><b>HYPER FUR EFFECTS</b><input type="checkbox" id="rgbFur" ${r.mode==='hyperfur'?'checked':''}></div><div class="rgb-switch"><b>REDUCED MOTION</b><input type="checkbox" id="reduceMotion" ${state.lowMotion?'checked':''}></div><div class="page-actions"><button class="metal gold" data-action="saveRgb">SAVE RGB SETTINGS</button><button class="metal" data-action="resetRgb">RESET TO DEFAULT</button></div></section><section class="pane"><h2>LOCAL DATA AND BACKUP</h2><p class="fine">Projects, notes, routes and settings persist on this device. Custom artwork is stored separately in the device's IndexedDB. A JSON backup includes the records and settings, not custom image files.</p><div class="page-actions"><button class="metal" data-action="export">EXPORT JSON BACKUP</button><button class="metal" data-action="import">IMPORT JSON BACKUP</button><button class="metal" data-action="copy">COPY BACKUP TEXT</button></div><textarea id="backupArea" class="search" style="min-height:110px" placeholder="Backup JSON appears here; you can also paste a saved backup" aria-label="Backup JSON"></textarea></section>`}
function render(){renderNav();let s;switch(state.page){case 'home':s=renderHome();break;case 'games':s=renderGames();break;case 'game':s=renderDetails();break;case 'ark':s=renderArk();break;case 'dinos':s=heading('ARK • PERSONAL COLLECTION','MY DINOS','♞')+'<div id="dt-root"></div>';break;case 'projects':case 'tasks':case 'notes':s=collectionPage(state.noteKind);break;case 'forge':s=renderForge();break;case 'printing':s=renderPrinting();break;case 'routes':s=renderRoutes();break;case 'settings':s=renderSettings();break;default:s=renderHome();} $('view').innerHTML=s;if(state.page==='dinos'&&window.renderPersonalDinos)window.renderPersonalDinos($('dt-root'));const logo=$('coreSquirrel');if(logo){const existing=document.querySelector('.drawer-top img');if(existing)logo.src=existing.src}refreshStatus();}
function applyRgb(){const r=state.rgb;const root=document.documentElement;const brightness=r.enabled?r.brightness:0;root.style.setProperty('--rgb-strength',String(brightness/100));root.style.setProperty('--accent',r.mode==='static'?r.hex:'#6dff36');root.style.setProperty('--rgb-cycle', (16 - r.speed*0.14).toFixed(1)+'s');document.body.dataset.rgb=r.mode;document.body.classList.toggle('no-rgb',!r.enabled);document.body.classList.toggle('unsynced',!r.sync);document.body.classList.toggle('reduce-motion',state.lowMotion);}
function saveRgb(){const r=state.rgb;r.mode=$('rgbFur')?.checked?'hyperfur':r.mode;r.enabled=!!$('rgbEnabled')?.checked;r.sync=!!$('rgbSync')?.checked;r.brightness=Number($('brightness')?.value)||85;r.speed=Number($('speed')?.value)||70;r.hex=$('rgbHex')?.value||'#63ff34';state.lowMotion=!!$('reduceMotion')?.checked;put('reduceMotion',state.lowMotion);put('rgb',r);applyRgb();toast('Lighting settings saved');render();}
function toggle(list,id){const s=new Set(get(list,[]));s.has(id)?s.delete(id):s.add(id);put(list,Array.from(s));render()}
function updateCardPhoto(gid){const g=GAMES.find(g=>g.id===gid);if(!g)return;const card=document.querySelector(`[data-game="${gid}"]`);if(!card)return;const i=state.imageIndex[gid]??0,src=gameImage(g,i);const img=card.querySelector('.gallery-photo');if(!img||!src)return;img.src=src;img.dataset.slot=String(i);img.alt=`${g.name} artwork ${i+1} of 3`;card.querySelectorAll('.dots .dot').forEach(b=>{const active=Number(b.dataset.slot)===i;b.classList.toggle('on',active);b.setAttribute('aria-pressed',String(active))});const counter=card.querySelector('.slide-counter');if(counter)counter.textContent=`${i+1}/3`}
function setSlide(gid,index){const g=GAMES.find(g=>g.id===gid);if(!g||!validIndexes(g).includes(index))return;state.imageIndex[gid]=index;updateCardPhoto(gid)}
function slide(gid,delta,quiet=false){const g=GAMES.find(g=>g.id===gid);if(!g)return;const indexes=validIndexes(g);if(indexes.length<2){if(!quiet)toast('Only one artwork is available');return}const idx=indexes.indexOf(state.imageIndex[gid]??indexes[0]);state.imageIndex[gid]=indexes[(idx+delta+indexes.length)%indexes.length];updateCardPhoto(gid)}

function refreshStatus(){const node=$('refreshView');if(node)node.textContent=new Intl.DateTimeFormat(undefined,{hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(new Date())}
let intervalCounter=0;setInterval(()=>{intervalCounter++;refreshStatus();if(state.page==='games'&&intervalCounter%2===0){const selected=GAMES[(Math.floor(intervalCounter/2)-1)%GAMES.length];slide(selected.id,1,true)}},1000);
let frameCount=0,frameStart=performance.now();function frame(now){frameCount++;if(now-frameStart>=1200){const fps=document.hidden?null:Math.round(frameCount*1000/(now-frameStart));const el=$('fpsValue');if(el)el.textContent=fps===null?'PAUSED':fps+' FPS';frameStart=now;frameCount=0}requestAnimationFrame(frame)}requestAnimationFrame(frame);
function openDatabase(){return new Promise((resolve,reject)=>{if(!window.indexedDB)return reject(Error('IndexedDB unavailable'));const request=indexedDB.open('squirrel-genesis-artwork',1);request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains('images'))request.result.createObjectStore('images')};request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)})}
async function loadAllArt(){try{state.artDb=await openDatabase();const tx=state.artDb.transaction('images','readonly');const st=tx.objectStore('images');const keys=await new Promise((resolve,reject)=>{const req=st.getAllKeys();req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});for(const k of keys){const blob=await new Promise((resolve,reject)=>{const req=st.get(k);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});if(blob?.type?.startsWith('image/')){const [gid,slot]=String(k).split(':');(state.imageSlots[gid]??={})[Number(slot)]=URL.createObjectURL(blob)}}render()}catch(err){console.warn('Artwork database unavailable',err)}}
async function uploadImages(gid,files){const g=GAMES.find(x=>x.id===gid);if(!g||!files.length)return;const first=Number.isInteger(state.uploadSlot)?state.uploadSlot:0;const eligible=files.slice(0,state.uploadSlot===null?3:1);let saved=0;let fails=0;for(let j=0;j<eligible.length;j++){const file=eligible[j],slot=first+j;if(!file.type.startsWith('image/')||file.size>9*1024*1024){fails++;continue}try{if(!state.artDb)state.artDb=await openDatabase();await new Promise((resolve,reject)=>{const t=state.artDb.transaction('images','readwrite');const req=t.objectStore('images').put(file,`${gid}:${slot}`);req.onsuccess=resolve;req.onerror=()=>reject(req.error)});if(state.imageSlots[gid]?.[slot])URL.revokeObjectURL(state.imageSlots[gid][slot]);(state.imageSlots[gid]??={})[slot]=URL.createObjectURL(file);saved++}catch(e){fails++;console.error('Failed saving artwork slot',slot,e)}}state.uploadSlot=null;render();toast(`${saved} photo(s) stored locally${fails?`, ${fails} not saved`:''}`)}
function exportJson(){const names=['projects','tasks','notes','favorites','installed','gameNotes','arkEntries','assets','printer','routes','rgb','reduceMotion'];const data={format:'Squirrel Studios Genesis local data',version:4,exportedAt:new Date().toISOString(),data:{}};for(const n of names)data.data[n]=get(n,Array.isArray(get(n,null))?[]:{});data.data.personalDinoTracker=window.exportPersonalDinoEdits?window.exportPersonalDinoEdits():null;return JSON.stringify(data,null,2)}
function importJson(text){let data;try{data=JSON.parse(text)}catch{toast('Invalid JSON file');return}if(data.format!=='Squirrel Studios Genesis local data'||!data.data||data.version!==4){toast('This is not a compatible Genesis v4 backup');return}const names=['projects','tasks','notes','favorites','installed','gameNotes','arkEntries','assets','printer','routes','rgb','reduceMotion'];for(const n of names){if(Object.prototype.hasOwnProperty.call(data.data,n))put(n,data.data[n])}if(window.importPersonalDinoEdits&&data.data.personalDinoTracker)window.importPersonalDinoEdits(data.data.personalDinoTracker);state.rgb=get('rgb',state.rgb);state.lowMotion=get('reduceMotion',false);applyRgb();render();toast('Backup data restored')}
function handleAction(button){const a=button.dataset.action,id=button.dataset.id||'';switch(a){case 'favorite':toggle('favorites',id);break;case 'installed':toggle('installed',id);break;case 'slide':slide(id,Number(button.dataset.dir)||1);break;case 'jump':setSlide(id,Number(button.dataset.slot));break;case 'details':state.page='game';state.game=id;state.currentSection='';render();break;case 'upload':state.game=id;state.uploadSlot=button.dataset.slot!==undefined&&button.dataset.slot!=='all'?Number(button.dataset.slot):null;$('artInput').multiple=state.uploadSlot===null;$('artInput').value='';$('artInput').click();break;case 'section':if(id==='ark'&&button.dataset.section==='Personal Dino Tracker'){navigate('dinos');break}state.page='game';state.game=id;state.currentSection=button.dataset.section;render();break;case 'saveGameNote':{const notes=get('gameNotes',{});notes[id]=$('gameNote').value;put('gameNotes',notes);toast('Game note saved');break}case 'list':state.noteKind=button.dataset.kind;state.page='projects';render();break;case 'addItem':{const kind=button.dataset.kind;const text=$('newEntry')?.value?.trim();if(!text){toast('Enter a name or note first');break}const items=oldItems(kind);items.unshift({id:uid(),text,done:false,project:kind==='tasks'?$('taskProject').value:''});put(kind,items);render();toast('Saved offline');break}case 'deleteItem':{if(!confirm('Delete this item?'))break;const kind=button.dataset.kind;put(kind,oldItems(kind).filter(x=>x.id!==id));render();break}case 'addArk':{const title=$('arkTitle').value.trim(),content=$('arkContent').value.trim(),category=$('arkTag').value.trim()||'Personal';if(!title||!content){toast('Both title and note are required');break}const rows=get('arkEntries',[]);rows.unshift({title,info:content,category,source:'User-authored note'});put('arkEntries',rows);render();toast('ARK note saved offline');break}case 'addForge':{const name=$('forgeName').value.trim();if(!name){toast('Enter an asset name');break}put('assets',[{id:uid(),name,target:$('forgeTarget').value,notes:$('forgeNotes').value},...get('assets',[])]);render();toast('Asset record saved');break}case 'removeAsset':if(confirm('Delete this asset record?')){put('assets',get('assets',[]).filter(x=>x.id!==id));render()}break;case 'savePrinter':{const p={name:$('printerName').value.trim()||'Printer',bedX:Number($('bedX').value),bedY:Number($('bedY').value),bedZ:Number($('bedZ').value),material:$('material').value};if([p.bedX,p.bedY,p.bedZ].some(n=>!Number.isFinite(n)||n<1||n>2000)){toast('Enter valid build dimensions');break}put('printer',p);toast('Printer saved');render();break}case 'checkFit':{const p=get('printer',{bedX:220,bedY:220,bedZ:250});const dims=['modelX','modelY','modelZ'].map(k=>Number($(k).value));if(dims.some(n=>!Number.isFinite(n)||n<=0)){toast('Enter all three model dimensions');break}const fits=(dims[0]<=p.bedX&&dims[1]<=p.bedY||dims[1]<=p.bedX&&dims[0]<=p.bedY)&&dims[2]<=p.bedZ;$('fitResult').textContent=fits?'Within stated bed limits (before margins/supports).':'Does not fit the stated bed dimensions in this orientation.';break}case 'addRoute':{const name=$('routeName').value.trim(),stops=$('routeStops').value.trim();if(!name||!stops){toast('Enter a name and stops');break}put('routes',[{id:uid(),name,stops},...get('routes',[])]);render();toast('Route saved offline');break}case 'deleteRoute':if(confirm('Delete this route?')){put('routes',get('routes',[]).filter(x=>x.id!==id));render()}break;case 'rgb':state.rgb.mode=button.dataset.mode;put('rgb',state.rgb);applyRgb();render();break;case 'saveRgb':saveRgb();break;case 'resetRgb':state.rgb={enabled:true,mode:'simple',brightness:85,speed:70,sync:true,hex:'#63ff34'};state.lowMotion=false;put('rgb',state.rgb);put('reduceMotion',false);applyRgb();render();toast('RGB defaults restored');break;case 'export':{const json=exportJson();$('backupArea').value=json;try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download='Genesis-backup.json';document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}catch{}toast('Backup text generated');break}case 'copy':{const a=$('backupArea');if(!a.value)a.value=exportJson();a.select();try{navigator.clipboard?.writeText(a.value).then(()=>toast('Backup copied'),()=>toast('Select and copy the backup text'))}catch{toast('Select and copy the text')}break}case 'import':{const content=$('backupArea').value.trim();if(content)importJson(content);else $('importInput').click();break}}}
document.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;if(btn.dataset.go){e.preventDefault();if(btn.dataset.go==='game'&&!state.game)state.game='7d2d';navigate(btn.dataset.go);return}if(btn.dataset.filter){state.gameFilter=btn.dataset.filter;render();return}if(btn.dataset.action){e.preventDefault();handleAction(btn)}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='arkCategory'){state.selectedCategory=el.value;const pos=window.scrollY;render();window.scrollTo(0,pos)}if(el.dataset.action==='completeTask'){const list=oldItems('tasks');const item=list.find(x=>x.id===el.dataset.id);if(item){item.done=el.checked;put('tasks',list);render()}}if(el.id==='rgbFur'){state.rgb.mode=el.checked?'hyperfur':'simple';applyRgb();render()}if(el.id==='rgbEnabled'){state.rgb.enabled=el.checked;applyRgb()}if(el.id==='rgbSync'){state.rgb.sync=el.checked;applyRgb()}if(el.id==='reduceMotion'){state.lowMotion=el.checked;applyRgb()}});
let searchDelay;document.addEventListener('input',e=>{const el=e.target;if(el.id==='gameSearch'){state.query=el.value;clearTimeout(searchDelay);searchDelay=setTimeout(()=>{const focusPos=el.selectionStart;render();const next=$('gameSearch');next?.focus();if(next?.setSelectionRange)next.setSelectionRange(focusPos,focusPos)},120)}else if(el.id==='arkSearch'){state.arkQuery=el.value;clearTimeout(searchDelay);searchDelay=setTimeout(()=>{render();$('arkSearch')?.focus()},180)}else if(el.id==='brightness'){$('brightnessText').textContent=el.value+'%';state.rgb.brightness=Number(el.value);applyRgb()}else if(el.id==='speed'){$('speedText').textContent=el.value+'%';state.rgb.speed=Number(el.value);applyRgb()}else if(el.id==='rgbHex'){state.rgb.hex=el.value;applyRgb()}});
$('artInput').addEventListener('change',e=>{uploadImages(state.game,Array.from(e.target.files||[]))});$('importInput').addEventListener('change',async e=>{const f=e.target.files?.[0];if(f&&f.size<5e6)importJson(await f.text());else toast('Invalid or overly large backup')});
$('openNav').addEventListener('click',()=>{if(window.innerWidth>850){$('app').classList.remove('nav-collapsed')}else{openDrawer()}});$('closeNav').addEventListener('click',()=>{if(window.innerWidth>850){$('app').classList.add('nav-collapsed');closeDrawer()}else closeDrawer()});$('shade').addEventListener('click',closeDrawer);$('settingsBtn').addEventListener('click',()=>navigate('settings'));
let swipeStart=null;document.addEventListener('touchstart',e=>{if(e.touches.length===1)swipeStart={x:e.touches[0].clientX,y:e.touches[0].clientY}}, {passive:true});document.addEventListener('touchend',e=>{if(!swipeStart)return;const dx=e.changedTouches[0].clientX-swipeStart.x,dy=e.changedTouches[0].clientY-swipeStart.y;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.6){if(state.drawerOpen&&dx<0)closeDrawer();else if(!state.drawerOpen&&dx>0&&swipeStart.x<26)openDrawer()}swipeStart=null},{passive:true});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});
const initial=decodeURIComponent((location.hash||'#home').slice(1));state.page=['home','games','ark','projects','forge','printing','routes','settings','dinos'].includes(initial)?initial:'home';state.noteKind='projects';applyRgb();oldItems('projects');oldItems('tasks');oldItems('notes');render();loadAllArt();

window.genesisBack=function(){if(state.drawerOpen){closeDrawer();return true}if(state.page==='dinos'){navigate('ark');return true}if(state.page!=='home'){navigate('home');return true}return false};
</script></body></html>
