<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Genesis</title><style>:root{color-scheme:dark;--g:#a6ff26}*{box-sizing:border-box}body{margin:0;background:#070a09;color:#ecffe5;font:15px system-ui,sans-serif}header{padding:32px 20px 18px;background:radial-gradient(ellipse at top,#173c23,#080c0a 70%);border-bottom:1px solid #315632}small{letter-spacing:3px;color:var(--g)}h1{margin:8px 0;font-size:32px;letter-spacing:2px}p{color:#b1c6b0}main{padding:18px;max-width:700px;margin:auto}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{background:#101b14;border:1px solid #2e5a31;border-radius:16px;padding:22px 12px;color:#e8ffe5;min-height:110px;text-align:left;font:inherit}.tile strong{display:block;color:var(--g);margin-bottom:10px}.panel{margin-top:20px;border:1px solid #2e5a31;border-radius:16px;padding:18px;background:#0c130f}input,button{font:inherit}input{width:100%;background:#060c08;color:white;border:1px solid #416b42;border-radius:8px;padding:12px;margin:6px 0}button.action{background:var(--g);color:#0b160b;border:0;border-radius:8px;padding:12px 18px;font-weight:700}li{padding:8px;border-bottom:1px solid #29432a}footer{padding:25px;color:#759374;text-align:center}</style></head><body><header><small>SQUIRREL STUDIOS</small><h1>GENESIS</h1><p>Offline development foundation</p></header><main><div class="grid"><button class="tile" onclick="openModule('Projects')"><strong>01 / PROJECTS</strong>Manage builds</button><button class="tile" onclick="openModule('Tasks')"><strong>02 / TASKS</strong>Track actions</button><button class="tile" onclick="openModule('Notes')"><strong>03 / NOTES</strong>Keep ideas local</button><button class="tile" onclick="openModule('Diagnostics')"><strong>04 / DIAGNOSTICS</strong>Check local status</button></div><section class="panel"><h2 id="heading">Projects</h2><p id="hint">Saved locally on this device.</p><div id="entry"><input id="newItem" maxlength="240" placeholder="Add an item"><button class="action" onclick="addItem()">Save</button></div><ul id="items"></ul></section></main><footer>GENESIS · FOUNDATION · v0.1.0</footer><script>let moduleName='Projects';const allowed=['Projects','Tasks','Notes','Diagnostics'];function getData(k){try{let x=JSON.parse(localStorage.getItem('genesis:'+k)||'[]');return Array.isArray(x)?x:[]}catch(e){return []}}function openModule(k){if(!allowed.includes(k))return;moduleName=k;document.getElementById('heading').textContent=k;document.getElementById('entry').hidden=k==='Diagnostics';document.getElementById('hint').textContent=k==='Diagnostics'?'Offline WebView diagnostics':'Saved locally on this device.';render()}function addItem(){let e=document.getElementById('newItem'),v=e.value.trim();if(!v)return;let a=getData(moduleName);a.push({id:Date.now()+':'+Math.random(),text:v});localStorage.setItem('genesis:'+moduleName,JSON.stringify(a));e.value='';render()}function removeItem(id){let a=getData(moduleName).filter(x=>x.id!==id);localStorage.setItem('genesis:'+moduleName,JSON.stringify(a));render()}function render(){let ul=document.getElementById('items');ul.replaceChildren();if(moduleName==='Diagnostics'){let li=document.createElement('li');li.textContent='Local storage: '+(typeof localStorage!=='undefined'?'available':'unavailable')+' · Network required: no';ul.append(li);return}for(let item of getData(moduleName)){let li=document.createElement('li');li.textContent=item.text+' ';let b=document.createElement('button');b.textContent='Remove';b.onclick=()=>removeItem(item.id);li.append(b);ul.append(li)}}openModule('Projects');</script></body></html>
