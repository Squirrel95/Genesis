name: Genesis v0.9.3 Signed Dino Upgrade
on:
  push:
    branches: [rebuild/approved-genesis-nov20]
    paths: [.github/workflows/genesis-v093-signed-release.yml]
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check dataset and app integration
        run: |
          node tests/check-personal-dino-tracker.js
          test -s app/src/main/assets/ark-personal-tracker.js
          grep -q 'versionCode = 19' app/build.gradle.kts
      - name: Install Android SDK 35
        run: |
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          fi
      - name: Require permanent signing identity
        env:
          SIGNING_STORE_B64: ${{ secrets.GENESIS_SIGNING_STORE_B64 }}
          GENESIS_SIGNING_STORE_PASSWORD: ${{ secrets.GENESIS_SIGNING_STORE_PASSWORD }}
          GENESIS_SIGNING_KEY_ALIAS: ${{ secrets.GENESIS_SIGNING_KEY_ALIAS }}
          GENESIS_SIGNING_KEY_PASSWORD: ${{ secrets.GENESIS_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_STORE_B64"
          test -n "$GENESIS_SIGNING_STORE_PASSWORD"
          test -n "$GENESIS_SIGNING_KEY_ALIAS"
          test -n "$GENESIS_SIGNING_KEY_PASSWORD"
          printf '%s' "$SIGNING_STORE_B64" | base64 -d > "$RUNNER_TEMP/genesis-release.jks"
          chmod 600 "$RUNNER_TEMP/genesis-release.jks"
          test -s "$RUNNER_TEMP/genesis-release.jks"
      - name: Assemble signed release
        env:
          GENESIS_SIGNING_STORE_FILE: ${{ runner.temp }}/genesis-release.jks
          GENESIS_SIGNING_STORE_PASSWORD: ${{ secrets.GENESIS_SIGNING_STORE_PASSWORD }}
          GENESIS_SIGNING_KEY_ALIAS: ${{ secrets.GENESIS_SIGNING_KEY_ALIAS }}
          GENESIS_SIGNING_KEY_PASSWORD: ${{ secrets.GENESIS_SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify signed APK and offline tracker assets
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          unzip -Z1 app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/assets.txt"
          for f in index.html ark-personal-seed.js ark-personal-tracker.js ark-personal-tracker.css; do
            grep -Fx "assets/$f" "$RUNNER_TEMP/assets.txt"
          done
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/release/app-release.apk | head -3
          sha256sum app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Genesis-v0.9.3-PERMANENT-SIGNED-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Publish Genesis v0.9.3 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.9.3 >/dev/null 2>&1; then
            gh release upload v0.9.3 "app/build/outputs/apk/release/app-release.apk#Genesis-v0.9.3.apk" --clobber
          else
            gh release create v0.9.3 "app/build/outputs/apk/release/app-release.apk#Genesis-v0.9.3.apk" --target "$GITHUB_SHA" --title "Genesis v0.9.3 · Personal Dino Tracker" --notes "Signed Genesis upgrade, built on the approved gunmetal/RGB design. Offline 34-dino personal tracker, feeding and level recommendations, inventory notes, Gacha cautions, local edits, and photo import. Original JPGs are distributed separately. Back up old app data before installation; in-place upgrades require matching signing certificates."
          fi
