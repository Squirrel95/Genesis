name: Genesis Android APK
on:
  push:
    branches: [main, feature/genesis-integrated-rebuild]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Genesis-foundation-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Package complete Genesis source for Claude
        run: |
          mkdir -p source-export
          git archive --format=zip --output=source-export/Genesis-v0.5.0-source.zip HEAD
      - name: Upload Genesis source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Genesis-v0.5.0-complete-source
          path: source-export/Genesis-v0.5.0-source.zip
          if-no-files-found: error
