name: Genesis Android APK
# Permanent release signing validation run; secrets are never committed to source.
on:
  push:
    branches: [main, 'feature/ascension-interface-rebuild']
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Compile debug preview (not suitable for in-place updates)
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload preview for engineering only
        uses: actions/upload-artifact@v4
        with:
          name: Genesis-UNSIGNED-RELEASE-NOT-READY-debug-preview
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  signed-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Require permanent release signing credentials
        env:
          SIGNING_STORE_B64: ${{ secrets.GENESIS_SIGNING_STORE_B64 }}
          GENESIS_SIGNING_STORE_PASSWORD: ${{ secrets.GENESIS_SIGNING_STORE_PASSWORD }}
          GENESIS_SIGNING_KEY_ALIAS: ${{ secrets.GENESIS_SIGNING_KEY_ALIAS }}
          GENESIS_SIGNING_KEY_PASSWORD: ${{ secrets.GENESIS_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_STORE_B64" || { echo "::error::Permanent signing key not provisioned"; exit 1; }
          test -n "$GENESIS_SIGNING_STORE_PASSWORD"
          test -n "$GENESIS_SIGNING_KEY_ALIAS"
          test -n "$GENESIS_SIGNING_KEY_PASSWORD"
          printf '%s' "$SIGNING_STORE_B64" | base64 -d > "$RUNNER_TEMP/genesis-release.jks"
          chmod 600 "$RUNNER_TEMP/genesis-release.jks"
      - name: Build signed upgrade APK
        env:
          GENESIS_SIGNING_STORE_FILE: ${{ runner.temp }}/genesis-release.jks
          GENESIS_SIGNING_STORE_PASSWORD: ${{ secrets.GENESIS_SIGNING_STORE_PASSWORD }}
          GENESIS_SIGNING_KEY_ALIAS: ${{ secrets.GENESIS_SIGNING_KEY_ALIAS }}
          GENESIS_SIGNING_KEY_PASSWORD: ${{ secrets.GENESIS_SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify release APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Upload signed installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Genesis-PERMANENT-SIGNED-UPGRADE-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Check signed APK metadata
        run: |
          set -euo pipefail
          sha256sum app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/genesis-badging.txt"
          sed -n '1,4p' "$RUNNER_TEMP/genesis-badging.txt"
      - name: Publish v0.8.1 signed APK direct download
        if: github.ref == 'refs/heads/feature/ascension-interface-rebuild' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.8.1 >/dev/null 2>&1; then
            echo "Updating signed APK asset on existing release v0.8.1."
            gh release upload v0.8.1 "app/build/outputs/apk/release/app-release.apk#Genesis-v0.8.1.apk" --clobber
          else
            gh release create v0.8.1 "app/build/outputs/apk/release/app-release.apk#Genesis-v0.8.1.apk" \
              --title "Genesis v0.8.1 · My Games" \
              --notes "Signed upgrade from Genesis 0.8.0 (versionCode 9). Adds My Games navigation for 7D2D, GTA5, and RDR2. Live game databases are not yet included; custom launcher icon is not yet integrated." \
              --target "$GITHUB_SHA"
          fi

  diagnose:
    if: always()
    needs: [build, signed-release]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Post workflow run ID and job results to Genesis PR
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_RESULT: ${{ needs.build.result }}
          RELEASE_RESULT: ${{ needs.signed-release.result }}
        run: |
          gh api repos/${GITHUB_REPOSITORY}/issues/2/comments \
            -f body="Genesis v0.8.1 build run ${GITHUB_RUN_ID}; preview=${PREVIEW_RESULT}; signed-release=${RELEASE_RESULT}; commit=${GITHUB_SHA}. Diagnostics: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > /dev/null
