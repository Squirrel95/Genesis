name: Genesis Android APK
# Permanent release signing validation run; secrets are never committed to source.
on:
  push:
    branches: [main, 'feature/ascension-interface-rebuild']
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Compile debug preview (not suitable for in-place updates)
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload preview for engineering only
        uses: actions/upload-artifact@v4
        with:
          name: Genesis-UNSIGNED-RELEASE-NOT-READY-debug-preview
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  signed-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Require permanent release signing credentials
        env:
          SIGNING_STORE_B64: ${{ secrets.GENESIS_SIGNING_STORE_B64 }}
          GENESIS_SIGNING_STORE_PASSWORD: ${{ secrets.GENESIS_SIGNING_STORE_PASSWORD }}
          GENESIS_SIGNING_KEY_ALIAS: ${{ secrets.GENESIS_SIGNING_KEY_ALIAS }}
          GENESIS_SIGNING_KEY_PASSWORD: ${{ secrets.GENESIS_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_STORE_B64" || { echo "::error::Permanent signing key not provisioned"; exit 1; }
          test -n "$GENESIS_SIGNING_STORE_PASSWORD"
          test -n "$GENESIS_SIGNING_KEY_ALIAS"
          test -n "$GENESIS_SIGNING_KEY_PASSWORD"
          printf '%s' "$SIGNING_STORE_B64" | base64 -d > "$RUNNER_TEMP/genesis-release.jks"
          chmod 600 "$RUNNER_TEMP/genesis-release.jks"
      - name: Test Ragnarok content in all game slots
        run: node tests/check-ragnarok-slots.js
      - name: Test map-specific navigation search sorting and notes
        run: node tests/check-asa-map-browser.js
      - name: Test offline guides and optional evidence links
        run: node tests/check-offline-ragnarok-guides.js
      - name: Build signed upgrade APK
        env:
          GENESIS_SIGNING_STORE_FILE: ${{ runner.temp }}/genesis-release.jks
          GENESIS_SIGNING_STORE_PASSWORD: ${{ secrets.GENESIS_SIGNING_STORE_PASSWORD }}
          GENESIS_SIGNING_KEY_ALIAS: ${{ secrets.GENESIS_SIGNING_KEY_ALIAS }}
          GENESIS_SIGNING_KEY_PASSWORD: ${{ secrets.GENESIS_SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify release APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Verify offline Ragnarok assets are bundled into the APK
        run: |
          set -euo pipefail
          unzip -Z1 app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/genesis-assets.txt"
          for filename in index.html ragnarok-data.js ragnarok-update-1-explore.js ragnarok-update-2-taming.js ragnarok-update-3-progression.js ragnarok-slots.js asa-map-browser.js ark-offline-guides.js; do
            grep -Fx "assets/$filename" "$RUNNER_TEMP/genesis-assets.txt" >/dev/null || { echo "::error::Missing packaged asset: $filename"; exit 1; }
          done
      - name: Upload signed installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Genesis-PERMANENT-SIGNED-UPGRADE-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Check signed APK metadata
        run: |
          set -euo pipefail
          sha256sum app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/genesis-badging.txt"
          sed -n '1,4p' "$RUNNER_TEMP/genesis-badging.txt"
      - name: Publish v0.8.7 signed APK direct download
        if: github.ref == 'refs/heads/feature/ascension-interface-rebuild' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.8.7 >/dev/null 2>&1; then
            echo "Updating signed APK asset on existing release v0.8.7."
            gh release upload v0.8.7 "app/build/outputs/apk/release/app-release.apk#Genesis-v0.8.7.apk" --clobber
          else
            gh release create v0.8.7 "app/build/outputs/apk/release/app-release.apk#Genesis-v0.8.7.apk" \
              --title "Genesis v0.8.7 · My Games" \
              --notes "Signed Genesis 0.8.7 upgrade (versionCode 15). Adds seven full offline Ragnarok guides for Bison, Griffin, Wyverns, Nunatak, caves, resources, and map exploration. Source links remain optional in collapsed proof sections; preserved 96 short facts and existing personal notes. Other map data remains pending verification. Custom launcher icon not yet integrated." \
              --target "$GITHUB_SHA"
          fi
