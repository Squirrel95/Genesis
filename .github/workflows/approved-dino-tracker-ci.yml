name: Verify Approved Genesis Dino Tracker
on:
  push:
    branches: [feature/approved-genesis-dino-tracker-20261123]
  pull_request:
    branches: [rebuild/approved-genesis-nov20]
jobs:
  android-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Validate JS, schema and approved-screen integration
        run: |
          node --check app/src/main/assets/ark-personal-seed.js
          node --check app/src/main/assets/ark-personal-tracker.js
          node tests/check-personal-dino-tracker.js
      - name: Ensure Android SDK 35
        run: |
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          fi
      - name: Compile APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Validate packaged offline dino files
        run: |
          unzip -Z1 app/build/outputs/apk/debug/app-debug.apk > assets.txt
          for f in index.html ark-personal-seed.js ark-personal-tracker.js ark-personal-tracker.css; do
            grep -Fx "assets/$f" assets.txt >/dev/null || exit 1
          done
      - name: Generate checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > APK-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Genesis-Approved-Dino-Tracker-Debug-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            APK-SHA256.txt
          if-no-files-found: error
