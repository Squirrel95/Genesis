name: Build Genesis rebuild debug APK
on:
  push:
    branches:
      - rebuild/approved-genesis-nov20
  pull_request:
    branches:
      - feature/ascension-interface-rebuild
jobs:
  build-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify bundled interface
        run: |
          test -s app/src/main/assets/index.html
          grep -q 'GENESIS' app/src/main/assets/index.html
          test -s app/build.gradle.kts
      - name: Build installable debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Generate SHA-256 manifest
        run: sha256sum app/build/outputs/apk/debug/*.apk > APK-SHA256.txt
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Genesis-Approved-Rebuild-Debug-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            APK-SHA256.txt
          if-no-files-found: error
